<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c1272d"><title>대왕레미콘 연락처</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0ee;font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e;padding-bottom:82px}button{font:inherit}header{background:#c1272d;color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}.title{font-size:21px;font-weight:800}.back{color:#fff;text-decoration:none;font-size:13px;border:1px solid #ffffff66;border-radius:8px;padding:7px 9px}.wrap{padding:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab{border:0;background:#fff;border:1px solid #dce0e5;border-radius:12px;padding:14px 8px;font-weight:800;color:#59616b}.tab.on{background:#c1272d;color:#fff;border-color:#c1272d}.section{background:#fff;border:1px solid #dde1e5;border-radius:15px;padding:14px}.section h2{font-size:18px;margin:0 0 5px}.section p{font-size:12px;color:#747d88;margin:0 0 12px}.empty{background:#f7f8f9;border:1px dashed #cfd4da;border-radius:12px;padding:26px 12px;text-align:center;color:#78818b;font-size:13px}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #d8dce2;display:flex;overflow-x:auto}.nav a{text-decoration:none;min-width:70px;flex:1;color:#707985;font-size:10px;padding:7px 2px;text-align:center}.nav b{display:block;font-size:21px;margin-bottom:2px}.nav .on{color:#c1272d}</style></head><body><header><div class="title">📞 연락처</div><a class="back" href="index.html">홈</a></header><main class="wrap"><div class="tabs"><button class="tab on" data-kind="contract">도급</button><button class="tab" data-kind="partner">협력업체</button></div><section class="section"><h2 id="heading">도급 연락처</h2><p id="desc">도급 업체 및 담당자 연락처</p><div class="empty" id="empty">등록된 도급 연락처가 없습니다.</div></section></main><nav class="nav"><a href="index.html"><b>🏠</b>홈</a><a href="notice.html"><b>📢</b>공지</a><a href="volume.html"><b>🚚</b>물량</a><a href="radio.html"><b>📻</b>무전</a><a href="dashboard.html"><b>📊</b>현황</a><a href="money.html"><b>💰</b>자금</a><a class="on" href="contacts.html"><b>📞</b>연락처</a><a href="rules.html"><b>📘</b>회칙</a></nav><script>const tabs=document.querySelectorAll('.tab'),heading=document.getElementById('heading'),desc=document.getElementById('desc'),empty=document.getElementById('empty');tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('on'));t.classList.add('on');const c=t.dataset.kind==='contract';heading.textContent=c?'도급 연락처':'협력업체 연락처';desc.textContent=c?'도급 업체 및 담당자 연락처':'협력업체 및 담당자 연락처';empty.textContent=c?'등록된 도급 연락처가 없습니다.':'등록된 협력업체 연락처가 없습니다.'});</script></body></html>
