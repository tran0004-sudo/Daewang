<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c1272d"><title>대왕레미콘 차량운행 현황판</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>:root{--bg:#eef0ee;--paper:#fff;--ink:#20252e;--muted:#6b7480;--line:#d6dae0;--line2:#e8ebef;--head:#28303b;--head2:#333d4a;--brand:#c1272d;--brandd:#9c1f24;--green:#198754;--blue:#1674d1;--orange:#e77710}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink);padding-bottom:24px}button,input,select{font:inherit}button{cursor:pointer;border:0}header{background:linear-gradient(180deg,var(--brand),var(--brandd));color:#fff;padding:12px;position:sticky;top:0;z-index:30}.top{display:flex;align-items:center;gap:9px}.back,.month{background:#fff2;color:#fff;border:1px solid #fff5;border-radius:9px;padding:8px 10px;font-weight:700}.title{flex:1}.title small{display:block;font-size:10px;opacity:.8}.title b{font-size:19px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;position:relative}.tool{color:#fff;border-radius:9px;padding:11px 6px;font-weight:800}.excel{background:var(--green)}.photo{background:var(--blue)}.drivers{background:var(--orange)}.excelmenu{display:none;position:absolute;left:0;top:48px;background:#fff;color:#222;width:calc(33.333% - 6px);border-radius:10px;box-shadow:0 8px 24px #0003;overflow:hidden;z-index:60}.excelmenu.show{display:block}.excelmenu button{display:block;width:100%;text-align:left;padding:12px;background:#fff;border-bottom:1px solid #eee}.base{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11px}.base input{width:58px;background:#fff2;color:#fff;border:1px solid #fff5;border-radius:7px;padding:6px;text-align:center}.hint{margin-top:9px;background:#fff6e8;color:#805515;border:1px solid #efd19a;border-radius:9px;padding:9px 10px;font-size:11px}main{padding:10px}.team{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:12px}.team-head{display:flex;justify-content:space-between;align-items:center;background:var(--head);color:#fff;padding:8px 11px}.team-head b{color:#ffd23f}.donebadge{background:#fff1;color:#d9dde2;border:1px solid #fff4;border-radius:18px;padding:4px 9px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{height:36px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;font-size:11px;white-space:nowrap}thead th{background:var(--head2);color:#fff}.c-name{position:sticky;left:0;z-index:5;background:#fff;min-width:112px;text-align:left;padding:0 6px;border-right:2px solid var(--line)}thead .c-name{background:var(--head2)}.nmwrap{display:flex;align-items:center;gap:6px}.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:#fff}.chk.on{background:#198754;border-color:#198754;color:#fff}.nm{font-weight:700;font-size:12px}.vn{font-size:10px;color:var(--muted)}td.day{min-width:29px}td.sum{min-width:45px;background:#eef3f7;font-weight:700}.overlay{position:fixed;inset:0;background:#1118;display:none;align-items:flex-end;justify-content:center;z-index:90}.overlay.show{display:flex}.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:17px}.sheet h2{margin:0 0 12px;font-size:20px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:#68717c;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:11px;border:1px solid #d8dde3;border-radius:9px;background:#f7f8f9}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary,.ghost,.danger{width:100%;padding:12px;border-radius:9px;font-weight:800;margin-top:7px}.primary{background:var(--brand);color:#fff}.ghost{background:#edf0f3}.danger{background:#b4232c;color:#fff}.driveritem{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px;border-top:1px solid #eee;padding:10px 0}.driveritem:first-of-type{border-top:0}.driveritem small{color:#777}.mini{padding:7px 9px;border-radius:7px;background:#edf0f3}.mini.del{background:#fee8ea;color:#b4232c}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#28303b;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:120}.toast.show{opacity:1}</style></head><body><header id="captureHead"><div class="top"><button class="back" onclick="location.href='index.html'">← 홈</button><div class="title"><small>대왕레미콘</small><b>차량운행 현황판</b></div><button class="month" id="monthBtn">2026. 9월</button></div><div class="tools"><button class="tool excel" id="excelBtn">📊 엑셀 저장/불러오기 ▾</button><button class="tool photo" id="photoBtn">📷 사진으로 저장</button><button class="tool drivers" id="driverBtn">👤 기사 관리</button><div class="excelmenu" id="excelMenu"><button id="excelSave">⬇ 엑셀로 저장</button><button id="excelLoad">⬆ 엑셀 불러오기</button></div></div><div class="base"><span>기준 평균</span><input id="baseIn" type="number" value="40"><span>개</span></div><div class="hint">엑셀 파일을 수정해 다시 불러오면 차량번호 기준으로 1~31일 탕수가 반영됩니다.</div></header><main id="board"></main><input type="file" id="excelIn" accept=".xlsx,.xls,.csv" hidden><div class="overlay" id="overlay"></div><div class="toast" id="toast"></div><script>const KEY='daewang_remicon_radio_v3',DAYS=31;const SEED=[[1,'김경진','5029'],[1,'박재영','5669'],[1,'김상종','7352'],[1,'강경돈','5143'],[1,'박원호','5389'],[2,'정갑천','7348'],[2,'정양환','7296'],[2,'신승수','6461'],[2,'손석목','8728'],[2,'유재수','8437'],[3,'황영호','5596'],[3,'이경구','5361'],[3,'이종학','5880'],[3,'최영득','6980'],[3,'함영철','7303'],[4,'김도호','5384'],[4,'박치화','6690'],[4,'류병곤','5472'],[4,'신해연','5579'],[4,'장병윤','7317'],[5,'박재영','5212'],[5,'이상복','7698'],[5,'조남욱','7569'],[5,'김재환','7701'],[5,'최용규','5606'],[6,'이명신','5280'],[6,'강성호','5210'],[6,'염규삼','7318'],[6,'정희수','7102'],[6,'전종현','5586']];let state=JSON.parse(localStorage.getItem(KEY)||'null')||{month:'2026. 9월',baseline:40,drivers:SEED.map((x,i)=>({id:i+1,team:x[0],name:x[1],vno:x[2],done:false,days:Array(DAYS).fill(0)}))};state.drivers=(state.drivers||[]).map((d,i)=>({...d,id:d.id||Date.now()+i,days:Array.from({length:DAYS},(_,k)=>Number((d.days||[])[k])||0)}));const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state));let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}function openSheet(h){$('#overlay').innerHTML='<div class="sheet">'+h+'</div>';$('#overlay').classList.add('show')}function closeSheet(){$('#overlay').classList.remove('show');$('#overlay').innerHTML=''}window.closeSheet=closeSheet;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet()};function render(){let h='';for(let team=1;team<=6;team++){const a=state.drivers.filter(d=>+d.team===team),done=a.filter(d=>d.done).length;h+=`<section class="team"><div class="team-head"><div><b>${team}</b>조</div><button class="donebadge" onclick="toggleTeam(${team})">✓ ${done}/${a.length}</button></div><div class="scroll"><table><thead><tr><th class="c-name">성명 / 차량No</th>`;for(let i=1;i<=DAYS;i++)h+=`<th>${i}</th>`;h+='<th>합계</th></tr></thead><tbody>';for(const d of a){const sum=d.days.reduce((s,n)=>s+(+n||0),0);h+=`<tr><td class="c-name"><div class="nmwrap"><button class="chk ${d.done?'on':''}" onclick="toggleDone(${d.id})">${d.done?'✓':''}</button><div onclick="editDriver(${d.id})"><div class="nm">${esc(d.name)}</div><div class="vn">${esc(d.vno)}</div></div></div></td>`;for(let i=0;i<DAYS;i++)h+=`<td class="day" onclick="editDay(${d.id},${i})">${+d.days[i]||''}</td>`;h+=`<td class="sum">${sum||''}</td></tr>`}h+='</tbody></table></div></section>'}$('#board').innerHTML=h;$('#monthBtn').textContent=state.month;$('#baseIn').value=state.baseline}function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}window.toggleDone=id=>{const d=state.drivers.find(x=>x.id==id);if(d){d.done=!d.done;save();render()}};window.toggleTeam=t=>{const a=state.drivers.filter(x=>+x.team===t),all=a.length&&a.every(x=>x.done);a.forEach(x=>x.done=!all);save();render()};window.editDay=(id,i)=>{const d=state.drivers.find(x=>x.id==id);if(!d)return;openSheet(`<h2>${esc(d.name)} · ${i+1}일</h2><div class="field"><label>탕수</label><input id="dv" type="number" value="${+d.days[i]||0}"></div><button class="primary" onclick="saveDay(${id},${i})">저장</button><button class="ghost" onclick="closeSheet()">닫기</button>`)};window.saveDay=(id,i)=>{const d=state.drivers.find(x=>x.id==id);if(d)d.days[i]=Math.max(0,+$('#dv').value||0);save();closeSheet();render()};window.editDriver=id=>{const d=state.drivers.find(x=>x.id==id);if(!d)return;openSheet(`<h2>기사 수정</h2><div class="field"><label>조</label><select id="et">${[1,2,3,4,5,6].map(t=>`<option value="${t}" ${t==d.team?'selected':''}>${t}조</option>`).join('')}</select></div><div class="field"><label>성명</label><input id="en" value="${esc(d.name)}"></div><div class="field"><label>차량번호</label><input id="ev" value="${esc(d.vno)}"></div><button class="primary" onclick="saveDriver(${id})">수정 저장</button><button class="danger" onclick="deleteDriver(${id})">기사 삭제</button><button class="ghost" onclick="closeSheet()">닫기</button>`)};window.saveDriver=id=>{const d=state.drivers.find(x=>x.id==id);if(!d)return;d.team=+$('#et').value;d.name=$('#en').value.trim()||d.name;d.vno=$('#ev').value.trim()||d.vno;save();closeSheet();render()};window.deleteDriver=id=>{const d=state.drivers.find(x=>x.id==id);if(!d||!confirm(`${d.name} 기사를 삭제할까요?`))return;state.drivers=state.drivers.filter(x=>x.id!=id);save();closeSheet();render();toast('기사 삭제 완료')};$('#driverBtn').onclick=()=>openDriverManager();function openDriverManager(){const items=state.drivers.slice().sort((a,b)=>a.team-b.team).map(d=>`<div class="driveritem"><div><b>${esc(d.name)}</b> <small>${esc(d.vno)} · ${d.team}조</small></div><button class="mini" onclick="editDriver(${d.id})">수정</button><button class="mini del" onclick="deleteDriver(${d.id})">삭제</button></div>`).join('');openSheet(`<h2>👤 기사 관리</h2><div class="row"><div class="field"><label>조</label><select id="at">${[1,2,3,4,5,6].map(t=>`<option value="${t}">${t}조</option>`).join('')}</select></div><div></div></div><div class="field"><label>성명</label><input id="an" placeholder="기사 이름"></div><div class="field"><label>차량번호</label><input id="av" placeholder="예: 5029"></div><button class="primary" onclick="addDriver()">+ 기사 추가</button><div style="margin-top:15px"><b>등록 기사 ${state.drivers.length}명</b>${items}</div><button class="ghost" onclick="closeSheet()">닫기</button>`)}window.addDriver=()=>{const name=$('#an').value.trim(),vno=$('#av').value.trim(),team=+$('#at').value;if(!name||!vno)return alert('성명과 차량번호를 입력하세요.');if(state.drivers.some(d=>String(d.vno)===vno))return alert('같은 차량번호가 이미 있습니다.');state.drivers.push({id:Date.now(),team,name,vno,done:false,days:Array(DAYS).fill(0)});save();render();openDriverManager();toast('기사 추가 완료')};$('#baseIn').onchange=e=>{state.baseline=+e.target.value||40;save()};$('#monthBtn').onclick=()=>openSheet(`<h2>표시 월</h2><div class="field"><label>예: 2026. 9월</label><input id="mv" value="${esc(state.month)}"></div><button class="primary" onclick="saveMonth()">저장</button><button class="ghost" onclick="closeSheet()">닫기</button>`);window.saveMonth=()=>{state.month=$('#mv').value.trim()||state.month;save();closeSheet();render()};$('#excelBtn').onclick=e=>{e.stopPropagation();$('#excelMenu').classList.toggle('show')};document.addEventListener('click',e=>{if(!e.target.closest('#excelBtn')&&!e.target.closest('#excelMenu'))$('#excelMenu').classList.remove('show')});function excelRows(){return state.drivers.map(d=>{const r={'조':d.team,'성명':d.name,'차량No':String(d.vno)};for(let i=1;i<=DAYS;i++)r[String(i)]=+d.days[i-1]||0;r['합계']=d.days.reduce((a,b)=>a+(+b||0),0);r['완료']=d.done?'완료':'';return r})}$('#excelSave').onclick=()=>{try{const ws=XLSX.utils.json_to_sheet(excelRows(),{header:['조','성명','차량No',...Array.from({length:DAYS},(_,i)=>String(i+1)),'합계','완료']});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'차량운행현황');XLSX.writeFile(wb,`대왕레미콘_${(state.month||'현황').replace(/[\\/:*?"<>|]/g,'_')}.xlsx`);toast('엑셀 저장 완료')}catch(e){toast('엑셀 저장 실패')}};$('#excelLoad').onclick=()=>$('#excelIn').click();$('#excelIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:''});let matched=0,changed=0;for(const r of rows){const v=String(r['차량No']||r['차량번호']||r['차량 No.']||r['차량 No']||'').trim();if(!v)continue;let d=state.drivers.find(x=>String(x.vno).trim()===v);if(!d){const name=String(r['성명']||'').trim();if(name){d={id:Date.now()+Math.random(),team:+r['조']||1,name,vno:v,done:false,days:Array(DAYS).fill(0)};state.drivers.push(d)}}if(!d)continue;matched++;if(r['성명'])d.name=String(r['성명']).trim();if(r['조'])d.team=Math.min(6,Math.max(1,+r['조']||1));for(let i=1;i<=DAYS;i++){let val=r[String(i)];if(val===''||val==null)val=r[`${i}일`];if(val!==''&&val!=null&&!Number.isNaN(Number(val))){const n=Math.max(0,Number(val)||0);if(d.days[i-1]!==n)changed++;d.days[i-1]=n}}const done=String(r['완료']||'').trim();if(done)d.done=/완료|yes|y|1|true|✓/i.test(done)}save();render();toast(`엑셀 반영 ${matched}명 · ${changed}칸 수정`)}catch(err){toast('엑셀 파일을 읽지 못했습니다.')}};$('#photoBtn').onclick=async()=>{try{toast('사진 만드는 중…');const canvas=await html2canvas(document.body,{backgroundColor:'#eef0ee',scale:1.5,useCORS:true,scrollX:0,scrollY:0,windowWidth:document.documentElement.scrollWidth,windowHeight:document.documentElement.scrollHeight});const a=document.createElement('a');a.download=`대왕레미콘_현황판_${(state.month||'').replace(/\s/g,'')}.png`;a.href=canvas.toDataURL('image/png');a.click();toast('사진 저장 완료')}catch(e){console.error(e);toast('사진 저장 실패')}};render();</script></body></html>
