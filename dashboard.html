<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c1272d">
<title>대왕레미콘 차량운행 현황판</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef0ee;--paper:#fff;--ink:#20252e;--muted:#6b7480;--line:#d6dae0;--line2:#e8ebef;--head:#28303b;--head2:#333d4a;--brand:#c1272d;--brand-d:#9c1f24;--pos:#1f8f4e;--shadow:0 6px 20px rgba(20,25,35,.10)}*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans KR',sans-serif}body{padding-bottom:30px}button,input,select{font:inherit}button{border:0;cursor:pointer}header{background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;padding:14px 12px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px #0002}.top{display:flex;align-items:center;gap:10px}.back{background:#fff2;color:#fff;border:1px solid #fff5;border-radius:9px;padding:8px 10px;font-weight:700}.title{flex:1}.title small{display:block;font-size:11px;opacity:.82}.title b{font-size:19px}.month{background:#fff2;color:#fff;border:1px solid #fff5;border-radius:8px;padding:7px 9px;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.action{background:#fff;color:var(--brand);border-radius:10px;padding:11px 7px;font-weight:800}.action.secondary{background:#fff2;color:#fff;border:1px solid #fff5}.base{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px}.base input{width:55px;border:1px solid #fff5;background:#fff2;color:#fff;border-radius:6px;padding:5px;text-align:center}main{padding:12px 10px}.team{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}.team-head{display:flex;align-items:center;justify-content:space-between;background:var(--head);color:#fff;padding:9px 12px}.team-head .tt{font-weight:900;font-size:15px}.team-head .tt b{color:#ffd23f}.donebadge{font-size:11.5px;font-weight:700;color:#c7ccd3;background:#fff1;border:1px solid #fff4;border-radius:20px;padding:4px 10px}.donebadge.all{background:var(--pos);border-color:var(--pos);color:#fff}.scroll{overflow-x:auto}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;font-size:12px;height:38px;white-space:nowrap}thead th{background:var(--head2);color:#fff;font-weight:700;font-size:11px;height:34px}.c-name{position:sticky;left:0;z-index:5;background:var(--paper);min-width:108px;max-width:108px;text-align:left;padding:0 6px;border-right:2px solid var(--line)}thead .c-name{background:var(--head2)}.nmwrap{display:flex;align-items:center;gap:6px}.chk{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:2px solid var(--line);background:#fff;color:#fff;font-size:12px;font-weight:700}.chk.on{background:var(--pos);border-color:var(--pos)}.nm{font-weight:700;font-size:12.5px}.vn{font-size:10.5px;color:var(--muted)}td.day{min-width:29px;max-width:29px}td.sum{min-width:46px;max-width:46px;font-weight:700;background:#eef3f7}.overlay{position:fixed;inset:0;background:#14192388;z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px;max-height:88vh;overflow:auto}.sheet h2{font-size:20px;margin-bottom:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;background:#f4f5f6;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}.primary,.ghost{width:100%;padding:13px;border-radius:10px;font-weight:800;margin-top:8px}.primary{background:var(--brand);color:#fff}.ghost{background:#f1f3f5;color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:#28303b;color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}.toast.show{opacity:1}.hint{background:#fff6e8;border:1px solid #efd19a;color:#805515;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.55;margin-top:9px}
</style>
</head>
<body>
<header>
 <div class="top"><button class="back" onclick="location.href='index.html'">← 홈</button><div class="title"><small>대왕레미콘</small><b>차량운행 현황판</b></div><button class="month" id="monthBtn">2026. 9월</button></div>
 <div class="actions"><button class="action" id="excelSave">⬇ 엑셀로 저장</button><button class="action secondary" id="excelLoad">⬆ 엑셀 불러오기</button></div>
 <div class="base"><span>기준 평균</span><input id="baseIn" type="number" value="40"><span>개</span></div>
 <div class="hint">엑셀 저장 파일을 수정한 뒤 다시 첨부하면 차량번호를 기준으로 1~31일 탕수가 현황판에 반영됩니다.</div>
</header>
<main id="board"></main>
<input type="file" id="excelIn" accept=".xlsx,.xls,.csv" hidden>
<div class="overlay" id="overlay"></div><div class="toast" id="toast"></div>
<script>
const KEY='daewang_remicon_radio_v3',DAYS=31;
const SEED=[[1,'김경진','5029'],[1,'박재영','5669'],[1,'김상종','7352'],[1,'강경돈','5143'],[1,'박원호','5389'],[2,'정갑천','7348'],[2,'정양환','7296'],[2,'신승수','6461'],[2,'손석목','8728'],[2,'유재수','8437'],[3,'황영호','5596'],[3,'이경구','5361'],[3,'이종학','5880'],[3,'최영득','6980'],[3,'함영철','7303'],[4,'김도호','5384'],[4,'박치화','6690'],[4,'류병곤','5472'],[4,'신해연','5579'],[4,'장병윤','7317'],[5,'박재영','5212'],[5,'이상복','7698'],[5,'조남욱','7569'],[5,'김재환','7701'],[5,'최용규','5606'],[6,'이명신','5280'],[6,'강성호','5210'],[6,'염규삼','7318'],[6,'정희수','7102'],[6,'전종현','5586']];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{month:'2026. 9월',baseline:40,drivers:SEED.map((x,i)=>({id:i+1,team:x[0],name:x[1],vno:x[2],done:false,days:Array(DAYS).fill(0)}))};
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state));let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
function openSheet(html){$('#overlay').innerHTML='<div class="sheet">'+html+'</div>';$('#overlay').classList.add('show')}
function closeSheet(){$('#overlay').classList.remove('show');$('#overlay').innerHTML=''}window.closeSheet=closeSheet;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet()};
function render(){let html='';for(let team=1;team<=6;team++){const list=state.drivers.filter(d=>d.team===team),done=list.filter(d=>d.done).length;html+=`<div class="team"><div class="team-head"><div class="tt"><b>${team}</b>조</div><button class="donebadge ${list.length&&done===list.length?'all':''}" onclick="toggleTeam(${team})">✓ ${done}/${list.length}</button></div><div class="scroll"><table><thead><tr><th class="c-name">성명 / 차량No</th>`;for(let i=1;i<=DAYS;i++)html+=`<th>${i}</th>`;html+='<th>합계</th></tr></thead><tbody>';for(const d of list){const sum=d.days.reduce((a,b)=>a+(+b||0),0);html+=`<tr><td class="c-name"><div class="nmwrap"><button class="chk ${d.done?'on':''}" onclick="toggleDone(${d.id})">${d.done?'✓':''}</button><div onclick="editDriver(${d.id})"><div class="nm">${d.name}</div><div class="vn">${d.vno}</div></div></div></td>`;for(let i=0;i<DAYS;i++)html+=`<td class="day" onclick="editDay(${d.id},${i})">${+d.days[i]||''}</td>`;html+=`<td class="sum">${sum||''}</td></tr>`}html+='</tbody></table></div></div>'}$('#board').innerHTML=html;$('#monthBtn').textContent=state.month;$('#baseIn').value=state.baseline}
window.toggleDone=id=>{const d=state.drivers.find(x=>x.id===id);d.done=!d.done;save();render()};
window.toggleTeam=team=>{const a=state.drivers.filter(x=>x.team===team),all=a.length&&a.every(x=>x.done);a.forEach(x=>x.done=!all);save();render()};
window.editDay=(id,i)=>{const d=state.drivers.find(x=>x.id===id);openSheet(`<h2>${d.name} · ${i+1}일</h2><div class="field"><label>탕수</label><input id="dv" type="number" value="${+d.days[i]||0}"></div><button class="primary" onclick="saveDay(${id},${i})">저장</button><button class="ghost" onclick="closeSheet()">닫기</button>`)};
window.saveDay=(id,i)=>{state.drivers.find(x=>x.id===id).days[i]=Math.max(0,+$('#dv').value||0);save();closeSheet();render()};
window.editDriver=id=>{const d=state.drivers.find(x=>x.id===id);openSheet(`<h2>기사 정보</h2><div class="field"><label>성명</label><input id="en" value="${d.name}"></div><div class="field"><label>차량 No.</label><input id="ev" value="${d.vno}"></div><div class="field"><label>조</label><select id="et">${[1,2,3,4,5,6].map(t=>`<option ${t===d.team?'selected':''}>${t}</option>`).join('')}</select></div><button class="primary" onclick="saveDriver(${id})">저장</button><button class="ghost" onclick="closeSheet()">닫기</button>`)};
window.saveDriver=id=>{const d=state.drivers.find(x=>x.id===id);d.name=$('#en').value.trim()||d.name;d.vno=$('#ev').value.trim()||d.vno;d.team=+$('#et').value;save();closeSheet();render()};
$('#baseIn').onchange=e=>{state.baseline=+e.target.value||40;save()};
$('#monthBtn').onclick=()=>{openSheet(`<h2>표시 월</h2><div class="field"><label>예: 2026. 9월</label><input id="mv" value="${state.month}"></div><button class="primary" onclick="saveMonth()">저장</button><button class="ghost" onclick="closeSheet()">닫기</button>`)};
window.saveMonth=()=>{state.month=$('#mv').value.trim()||state.month;save();closeSheet();render()};
function excelRows(){return state.drivers.map(d=>{const r={'조':d.team,'성명':d.name,'차량No':String(d.vno)};for(let i=1;i<=DAYS;i++)r[String(i)]=+d.days[i-1]||0;r['합계']=d.days.reduce((a,b)=>a+(+b||0),0);r['완료']=d.done?'완료':'';return r})}
$('#excelSave').onclick=()=>{try{const ws=XLSX.utils.json_to_sheet(excelRows(),{header:['조','성명','차량No',...Array.from({length:DAYS},(_,i)=>String(i+1)),'합계','완료']});ws['!cols']=[{wch:6},{wch:12},{wch:10},...Array(DAYS).fill({wch:5}),{wch:8},{wch:8}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'차량운행현황');const safe=(state.month||'현황').replace(/[\\/:*?"<>|]/g,'_');XLSX.writeFile(wb,`대왕레미콘_${safe}.xlsx`);toast('엑셀 파일 저장 완료')}catch(e){console.error(e);toast('엑셀 저장 실패')}};
$('#excelLoad').onclick=()=>$('#excelIn').click();
$('#excelIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=await f.arrayBuffer();const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});let matched=0,changed=0;for(const row of rows){const v=String(row['차량No']||row['차량번호']||row['차량 No.']||row['차량 No']||'').trim();if(!v)continue;const d=state.drivers.find(x=>String(x.vno).trim()===v);if(!d)continue;matched++;for(let i=1;i<=DAYS;i++){let val=row[String(i)];if(val===''||val==null)val=row[`${i}일`];if(val!==''&&val!=null&&!Number.isNaN(Number(val))){const n=Math.max(0,Number(val)||0);if(d.days[i-1]!==n)changed++;d.days[i-1]=n}}const done=String(row['완료']||'').trim();if(done)d.done=/완료|yes|y|1|true|✓/i.test(done)}save();render();toast(`엑셀 반영 완료 · ${matched}명 매칭 · ${changed}칸 수정`)}catch(err){console.error(err);toast('엑셀 파일을 읽지 못했습니다')}};
render();
</script>
</body></html>
