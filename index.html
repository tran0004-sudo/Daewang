<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c1272d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="대왕레미콘"><link rel="icon" href="icons/app-icon.png"><link rel="apple-touch-icon" href="icons/app-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>대왕레미콘</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef0ee;font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e}header{background:#c1272d;color:#fff;padding:17px 16px}header b{font-size:21px}main{min-height:calc(100vh - 70px);padding-bottom:78px}button{font:inherit;border:0;cursor:pointer}.home{padding:14px 12px}.hero{background:linear-gradient(135deg,#c1272d,#8f1c21);color:#fff;border-radius:17px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{background:#fff;border:1px solid #dfe2e6;border-radius:15px;padding:19px 13px;text-align:left;box-shadow:0 4px 12px #0000000a}.card i{font-style:normal;font-size:29px;display:block;margin-bottom:8px}.card strong{font-size:16px}.card small{display:block;color:#747d88;margin-top:5px}.page{padding:15px 12px}.page h2{font-size:22px}.box{background:#fff;border:1px solid #dde1e5;border-radius:14px;padding:18px;line-height:1.7}.nav{position:fixed;z-index:40;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #d8dce2;display:flex;overflow-x:auto;box-shadow:0 -3px 14px #0001}.nav button{background:#fff;min-width:70px;flex:1;color:#707985;font-size:10px;padding:6px 2px}.nav b{display:block;font-size:21px;margin-bottom:2px}.nav .on{color:#c1272d}.launch{width:100%;margin-top:14px;padding:14px;border-radius:10px;background:#c1272d;color:#fff;font-weight:bold}</style></head><body><header><b>대왕레미콘</b><div style="font-size:12px;opacity:.85">DAEWANG REMICON</div></header><main id="app"></main><nav class="nav" id="nav"></nav><script>const P=[['home','🏠','홈'],['notice','📢','공지사항'],['volume','🚚','오늘물량'],['radio','📻','무전'],['board','📊','현황판'],['money','💰','가계부'],['rules','📘','회칙']];const app=document.querySelector('#app'),nav=document.querySelector('#nav');nav.innerHTML=P.map(x=>`<button data-p="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');function page(p){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='home'){app.innerHTML=`<section class="home"><div class="hero"><h1>대왕레미콘</h1><div>업무를 한 곳에서 빠르게 확인하세요.</div></div><div class="grid">${P.slice(1).map(x=>`<button class="card" data-go="${x[0]}"><i>${x[1]}</i><strong>${x[2]}</strong><small>${x[0]==='radio'?'실시간 무전':x[0]==='board'?'차량운행 현황':'확인 및 관리'}</small></button>`).join('')}</div></section>`;app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>page(b.dataset.go));return}const x=P.find(x=>x[0]===p);let desc={notice:'회사 공지와 전달사항을 확인합니다.',volume:'오늘 예정 물량과 배차 정보를 확인합니다.',radio:'기사 초대 및 실시간 무전방을 사용합니다.',board:'기존 차량운행 현황판을 엽니다.',money:'수입·지출·회비 내역을 관리합니다.',rules:'대왕레미콘 회칙과 운영 규정을 확인합니다.'}[p];app.innerHTML=`<section class="page"><h2>${x[1]} ${x[2]}</h2><div class="box">${desc}${p==='radio'?'<button class="launch" onclick="location.href=\'radio.html\'">무전 시작</button>':''}${p==='board'?'<button class="launch" onclick="location.href=\'dashboard.html\'">현황판 열기</button>':''}</div></section>`}nav.onclick=e=>{let b=e.target.closest('[data-p]');if(b)page(b.dataset.p)};page('home');</script></body></html>
