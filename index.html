<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대왕레미콘 차량운행 현황판</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><style>:root{--r:#b9252b;--d:#28303b;--g:#168447;--bg:#eef0ee;--line:#d9dde2}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e;padding-bottom:80px}header{position:sticky;top:0;z-index:5;background:linear-gradient(#c1272d,#951f24);color:#fff;padding:14px;box-shadow:0 2px 8px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:20px;font-weight:900}.actions{display:grid;grid-template-columns:1.15fr 1fr .75fr;gap:7px;margin-top:12px}.btn{border:1px solid #ffffff55;background:#ffffff20;color:#fff;border-radius:10px;padding:11px 8px;font-weight:800;font-size:13px}.btn.photo{background:#fff;color:var(--r)}main{padding:10px}.team{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 14px #00000012}.th{display:flex;justify-content:space-between;align-items:center;background:var(--d);color:#fff;padding:9px 11px;font-weight:800}.scroll{overflow:auto}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{border-right:1px solid #e8ebef;border-bottom:1px solid #e8ebef;text-align:center;height:36px;font-size:11px;white-space:nowrap}thead th{background:#333d4a;color:#fff;min-width:26px}.name{position:sticky;left:0;z-index:2;background:#fff;min-width:112px;text-align:left;padding:0 6px}.nm{font-weight:800}.vn{font-size:10px;color:#777}.chk{width:21px;height:21px;border:2px solid #ccd2d8;border-radius:6px;background:#fff;margin-right:5px}.chk.on{background:var(--g);border-color:var(--g);color:#fff}.sum{font-weight:800;background:#eef3f7;min-width:42px}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#1119;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:18px}.sheet h2{margin:0 0 6px}.sub{font-size:12px;color:#67717d;line-height:1.5;margin-bottom:14px}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:800;color:#67717d;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd2d8;border-radius:10px;font-size:16px}.primary,.ghost{width:100%;border:0;border-radius:11px;padding:13px;font-weight:800;font-size:15px}.primary{background:var(--r);color:#fff}.ghost{background:#f1f3f5;color:#4f5964;margin-top:8px}.warn{font-size:12px;line-height:1.5;background:#fff4df;border:1px solid #efcf96;border-radius:10px;padding:10px;margin:10px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{padding:6px 9px;border-radius:20px;background:#eef3f7;font-size:11px;font-weight:800}.ptt{display:block;width:160px;height:160px;border-radius:50%;border:0;background:var(--r);color:#fff;font-size:23px;font-weight:900;margin:18px auto;box-shadow:0 10px 24px #c1272d55;touch-action:none}.ptt.on{background:var(--g);transform:scale(.96)}.status{padding:10px;border-radius:10px;background:#edf5ef;color:#176b3b;font-size:12px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#252c35;color:#fff;border-radius:10px;padding:11px 16px;opacity:0;transition:.2s;z-index:50}.toast.on{opacity:1}</style></head><body><header><div class="top"><div class="title">대왕레미콘 차량운행 현황판</div><b id="month">2026. 9월</b></div><div class="actions"><button class="btn photo" id="photoBtn">📷 사진으로 입력</button><button class="btn" id="addBtn">＋ 기사 추가</button><button class="btn" id="radioBtn">📻 무전</button></div></header><main id="board"></main><input id="fileIn" type="file" accept="image/*" capture="environment" hidden><div id="overlay" class="overlay"></div><div id="toast" class="toast"></div><script>const DAYS=31,KEY='daewang_board_radio_v2';const seed=[[1,'김경진','5029'],[1,'박재영','5669'],[1,'김상종','7352'],[1,'강경돈','5143'],[1,'박원호','5389'],[2,'정갑천','7348'],[2,'정양환','7296'],[2,'신승수','6461'],[2,'손석목','8728'],[2,'유재수','8437'],[3,'황영호','5596'],[3,'이경구','5361'],[3,'이종학','5880'],[3,'최영득','6980'],[3,'함영철','7303'],[4,'김도호','5384'],[4,'박치화','6690'],[4,'류병곤','5472'],[4,'신해연','5579'],[4,'장병윤','7317'],[5,'박재영','5212'],[5,'이상복','7698'],[5,'조남욱','7569'],[5,'김재환','7701'],[5,'최용규','5606'],[6,'이명신','5280'],[6,'강성호','5210'],[6,'염규삼','7318'],[6,'정희수','7102'],[6,'전종현','5586']];let state=JSON.parse(localStorage.getItem(KEY)||'null')||{month:'2026. 9월',drivers:seed.map((x,i)=>({id:i+1,team:x[0],name:x[1],vno:x[2],done:false,days:Array(DAYS).fill(0)}))};const $=q=>document.querySelector(q),save=()=>localStorage.setItem(KEY,JSON.stringify(state));function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}function openSheet(h){$('#overlay').innerHTML='<div class="sheet">'+h+'</div>';$('#overlay').classList.add('show')}function closeSheet(){$('#overlay').classList.remove('show')}window.closeSheet=closeSheet;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()};function render(){let h='';for(let t=1;t<=6;t++){let a=state.drivers.filter(d=>d.team===t);h+='<section class="team"><div class="th"><span>'+t+'조</span><span>'+a.filter(x=>x.done).length+'/'+a.length+'</span></div><div class="scroll"><table><thead><tr><th class="name">성명 / 차량No</th>';for(let d=1;d<=DAYS;d++)h+='<th>'+d+'</th>';h+='<th>합계</th></tr></thead><tbody>';for(const x of a){let sum=x.days.reduce((p,c)=>p+(+c||0),0);h+='<tr><td class="name"><button class="chk '+(x.done?'on':'')+'" onclick="toggle('+x.id+')">'+(x.done?'✓':'')+'</button><span onclick="editDriver('+x.id+')"><span class="nm">'+x.name+'</span><br><span class="vn">'+x.vno+'</span></span></td>';x.days.forEach((v,i)=>h+='<td onclick="day('+x.id+','+i+')">'+(v||'')+'</td>');h+='<td class="sum">'+(sum||'')+'</td></tr>'}h+='</tbody></table></div></section>'}$('#board').innerHTML=h;$('#month').textContent=state.month}window.toggle=id=>{let d=state.drivers.find(x=>x.id===id);d.done=!d.done;save();render()};window.day=(id,i)=>{let d=state.drivers.find(x=>x.id===id);openSheet('<h2>'+d.name+' · '+(i+1)+'일</h2><div class="field"><label>탕수</label><input id="dv" type="number" value="'+(d.days[i]||0)+'"></div><button class="primary" onclick="saveDay('+id+','+i+')">저장</button><button class="ghost" onclick="closeSheet()">닫기</button>')};window.saveDay=(id,i)=>{state.drivers.find(x=>x.id===id).days[i]=Math.max(0,+$('#dv').value||0);save();closeSheet();render()};window.editDriver=id=>{let d=state.drivers.find(x=>x.id===id);openSheet('<h2>기사 정보</h2><div class="field"><label>성명</label><input id="en" value="'+d.name+'"></div><div class="field"><label>차량 No.</label><input id="ev" value="'+d.vno+'"></div><div class="field"><label>조</label><select id="et">'+[1,2,3,4,5,6].map(t=>'<option '+(t===d.team?'selected':'')+'>'+t+'</option>').join('')+'</select></div><button class="primary" onclick="saveDriver('+id+')">저장</button><button class="ghost" onclick="closeSheet()">닫기</button>')};window.saveDriver=id=>{let d=state.drivers.find(x=>x.id===id);d.name=$('#en').value.trim()||d.name;d.vno=$('#ev').value.trim()||d.vno;d.team=+$('#et').value;save();closeSheet();render()};$('#addBtn').onclick=()=>openSheet('<h2>기사 추가</h2><div class="field"><label>성명</label><input id="an"></div><div class="field"><label>차량 No.</label><input id="av"></div><div class="field"><label>조</label><select id="at">'+[1,2,3,4,5,6].map(t=>'<option>'+t+'</option>').join('')+'</select></div><button class="primary" onclick="addDriver()">추가</button><button class="ghost" onclick="closeSheet()">닫기</button>');window.addDriver=()=>{let n=$('#an').value.trim();if(!n)return toast('성명을 입력하세요');state.drivers.push({id:Date.now(),team:+$('#at').value,name:n,vno:$('#av').value.trim(),done:false,days:Array(DAYS).fill(0)});save();closeSheet();render()};$('#photoBtn').onclick=()=>$('#fileIn').click();$('#fileIn').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;openSheet('<h2>사진 문자 인식 중…</h2><div class="sub">기사명, 차량번호, 숫자를 읽고 있습니다.</div>');try{let r=await Tesseract.recognize(f,'kor+eng');let lines=r.data.text.split(/\n+/).map(x=>x.trim()).filter(Boolean),found=0;for(const line of lines){let v=(line.match(/\b\d{4}\b/)||[])[0];if(!v)continue;let d=state.drivers.find(x=>x.vno===v),nums=line.match(/\b\d{1,2}\b/g)||[];if(d&&nums.length){nums.slice(0,DAYS).forEach((n,i)=>d.days[i]=+n);found++}}save();closeSheet();render();toast('사진 인식 완료 · '+found+'명 반영')}catch(err){openSheet('<h2>인식 실패</h2><div class="warn">사진을 정면에서 한 조씩 촬영해 다시 시도하세요.</div><button class="primary" onclick="closeSheet()">확인</button>')}};const CFGKEY='daewang_firebase_cfg';let db=null,stream=null,me=null,selfDriver=null,peers=new Map(),audios=new Map(),listeners=[];const ROOM='daewang-main';function cfg(){try{return JSON.parse(localStorage.getItem(CFGKEY)||'null')}catch{return null}}function firebaseReady(){let c=cfg();if(!c||!c.apiKey||!c.databaseURL||!c.projectId)return false;try{if(!firebase.apps.length)firebase.initializeApp(c);db=firebase.database();return true}catch(e){return false}}function setup(){let c=cfg()||{};openSheet('<h2>📻 무전 설정</h2><div class="sub">Firebase Realtime Database의 웹 앱 설정값을 입력하세요.</div><div class="field"><label>API Key</label><input id="fa" value="'+(c.apiKey||'')+'"></div><div class="field"><label>Database URL</label><input id="fd" value="'+(c.databaseURL||'')+'"></div><div class="field"><label>Project ID</label><input id="fp" value="'+(c.projectId||'')+'"></div><div class="field"><label>Auth Domain</label><input id="fh" value="'+(c.authDomain||'')+'"></div><div class="field"><label>App ID</label><input id="fi" value="'+(c.appId||'')+'"></div><div class="warn">Realtime Database에서 이 앱의 읽기/쓰기가 허용되어야 합니다. 실제 운영 시에는 인증과 보안 규칙을 적용하세요.</div><button class="primary" onclick="saveCfg()">설정 저장</button><button class="ghost" onclick="closeSheet()">닫기</button>')}window.saveCfg=()=>{let c={apiKey:$('#fa').value.trim(),databaseURL:$('#fd').value.trim(),projectId:$('#fp').value.trim(),authDomain:$('#fh').value.trim(),appId:$('#fi').value.trim()};if(!c.apiKey||!c.databaseURL||!c.projectId)return toast('필수 설정값을 입력하세요');localStorage.setItem(CFGKEY,JSON.stringify(c));closeSheet();toast('무전 설정 저장됨')};$('#radioBtn').onclick=()=>{let checked=state.drivers.filter(x=>x.done);if(!checked.length)return toast('먼저 무전할 기사에 체크하세요');if(!firebaseReady())return setup();openSheet('<h2>📻 실시간 무전</h2><div class="sub">체크한 기사만 무전 대상입니다. 각 휴대폰에서 본인 이름을 선택하세요.</div><div class="chips">'+checked.map(x=>'<span class="chip">✓ '+x.name+'</span>').join('')+'</div><div class="field"><label>내 기사 선택</label><select id="self">'+checked.map(x=>'<option value="'+x.id+'">'+x.name+' · '+x.vno+'</option>').join('')+'</select></div><button id="join" class="primary" onclick="joinRadio()">무전방 참가</button><div id="live" hidden><div id="status" class="status">연결 준비 중…</div><div id="members" class="chips"></div><button id="ptt" class="ptt">누르고<br>말하기</button><button class="ghost" onclick="leaveRadio();closeSheet()">무전방 나가기</button></div><button class="ghost" onclick="setup()">⚙ Firebase 설정</button>')};async function peer(id,offer){if(peers.has(id))return peers.get(id);let pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(id,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)db.ref('radio/'+ROOM+'/cand/'+id+'/'+me).push(e.candidate.toJSON())};pc.ontrack=e=>{let a=audios.get(id)||document.createElement('audio');a.autoplay=true;a.playsInline=true;a.srcObject=e.streams[0];if(!audios.has(id)){document.body.appendChild(a);audios.set(id,a)}};if(offer){let o=await pc.createOffer();await pc.setLocalDescription(o);await db.ref('radio/'+ROOM+'/offers/'+id+'/'+me).set({type:o.type,sdp:o.sdp})}return pc}window.joinRadio=async()=>{try{selfDriver=state.drivers.find(x=>x.id==$('#self').value);me='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});stream.getAudioTracks().forEach(t=>t.enabled=false);$('#join').hidden=true;$('#live').hidden=false;let root=db.ref('radio/'+ROOM),m=root.child('members');await m.child(me).set({name:selfDriver.name,vno:selfDriver.vno});m.child(me).onDisconnect().remove();let cb=m.on('value',s=>{let o=s.val()||{};$('#members').innerHTML=Object.values(o).map(x=>'<span class="chip">🔊 '+x.name+'</span>').join('');$('#status').textContent='연결 인원 '+Object.keys(o).length+'명'});listeners.push([m,'value',cb]);cb=m.on('child_added',s=>{if(s.key!==me&&me<s.key)peer(s.key,true)});listeners.push([m,'child_added',cb]);let r=root.child('offers/'+me);cb=r.on('child_added',async s=>{let pc=await peer(s.key,false);await pc.setRemoteDescription(s.val());let a=await pc.createAnswer();await pc.setLocalDescription(a);await root.child('answers/'+s.key+'/'+me).set({type:a.type,sdp:a.sdp})});listeners.push([r,'child_added',cb]);r=root.child('answers/'+me);cb=r.on('child_added',async s=>{let pc=peers.get(s.key);if(pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(s.val())});listeners.push([r,'child_added',cb]);r=root.child('cand/'+me);cb=r.on('child_added',s=>{let src=s.key,c=s.ref.on('child_added',async x=>{let pc=await peer(src,false);try{await pc.addIceCandidate(x.val())}catch(e){}});listeners.push([s.ref,'child_added',c])});listeners.push([r,'child_added',cb]);let b=$('#ptt'),tx=v=>{stream.getAudioTracks().forEach(t=>t.enabled=v);b.classList.toggle('on',v);b.innerHTML=v?'송신 중…':'누르고<br>말하기'};['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();tx(true)},{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();tx(false)},{passive:false}))}catch(e){toast(e.name==='NotAllowedError'?'마이크 권한을 허용하세요':'무전 연결 실패')}};window.leaveRadio=async()=>{try{if(db&&me)await db.ref('radio/'+ROOM+'/members/'+me).remove()}catch(e){}listeners.forEach(x=>{try{x[0].off(x[1],x[2])}catch(e){}});listeners=[];peers.forEach(x=>x.close());peers.clear();audios.forEach(x=>x.remove());audios.clear();if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;me=null};render();</script></body></html>
