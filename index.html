<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c1272d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="대왕레미콘">
  <link rel="icon" type="image/png" href="icons/app-icon.png">
  <link rel="apple-touch-icon" href="icons/app-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>대왕레미콘</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef0ee;font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e;padding-bottom:76px}
    header{background:#c1272d;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
    header .brand{flex:1}
    header b{font-size:22px}
    .install{border:1px solid #ffffffaa;background:#ffffff20;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;cursor:pointer}
    .home{padding:14px 12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .card{text-decoration:none;color:#20252e;background:#fff;border:1px solid #dfe2e6;border-radius:15px;padding:20px 13px;box-shadow:0 4px 12px #0000000a;display:block}
    .card i{font-style:normal;font-size:31px;display:block;margin-bottom:8px}
    .card strong{font-size:16px}
    .card small{display:block;color:#747d88;margin-top:5px}
    .nav{position:fixed;z-index:40;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #d8dce2;display:flex;overflow-x:auto;box-shadow:0 -3px 14px #0001}
    .nav a{text-decoration:none;background:#fff;min-width:70px;flex:1;color:#707985;font-size:10px;padding:7px 2px;text-align:center}
    .nav b{display:block;font-size:21px;margin-bottom:2px}
    .nav a:first-child{color:#c1272d}
    .installLayer{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:22px}
    .installBox{width:min(410px,100%);max-height:calc(100vh - 44px);overflow:auto;background:#fff;border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 20px 60px #0005}
    .appicon{width:92px;height:92px;object-fit:cover;border-radius:22px;box-shadow:0 8px 24px #0002;margin-bottom:10px}
    .installBox h2{margin:4px 0 6px;font-size:24px}
    .installBox .lead{margin:0 0 16px;color:#68717d;font-size:14px;line-height:1.55}
    .platformButtons{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
    .platformInstall{width:100%;border:1px solid #dfe2e6;border-radius:14px;padding:13px 14px;background:#fff;color:#20252e;text-align:left;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px}
    .platformInstall span{font-size:24px;width:30px;text-align:center}
    .platformInstall small{display:block;color:#747d88;font-size:11px;font-weight:600;margin-top:2px}
    .platformInstall.current{border-color:#c1272d;background:#fff6f6;color:#a61e24;box-shadow:0 0 0 2px #c1272d12}
    .installMessage{margin-top:14px;border-radius:13px;background:#f3f5f7;padding:13px 12px;color:#5f6873;font-size:13px;line-height:1.65;text-align:left}
    .installMessage b{color:#20252e}
    .closeInstall{margin-top:12px;border:0;background:none;color:#7b838c;padding:9px 14px;cursor:pointer}
    @media(min-width:760px){.platformButtons{grid-template-columns:repeat(3,1fr)}.platformInstall{display:block;text-align:center;padding:14px 8px}.platformInstall span{display:block;width:auto;margin-bottom:5px}.platformInstall small{min-height:28px}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><b>대왕레미콘</b><div style="font-size:12px;opacity:.85">DAEWANG REMICON</div></div>
    <button class="install" id="installBtn">📲 설치</button>
  </header>

  <main class="home">
    <div class="grid">
      <a class="card" href="notice.html"><i>📢</i><strong>공지사항</strong><small>회사 공지 확인</small></a>
      <a class="card" href="volume.html"><i>🚚</i><strong>오늘물량</strong><small>오늘 물량·배차</small></a>
      <a class="card" href="radio.html"><i>📻</i><strong>무전</strong><small>실시간 무전</small></a>
      <a class="card" href="dashboard.html"><i>📊</i><strong>현황판</strong><small>차량운행 현황</small></a>
      <a class="card" href="vehicle.html"><i>🛠️</i><strong>차량관리</strong><small>개인 정비·점검·교체주기</small></a>
      <a class="card" href="money.html"><i>💰</i><strong>자금관리</strong><small>실시간 공동장부</small></a>
      <a class="card" href="contacts.html"><i>📞</i><strong>연락처</strong><small>도급·협력업체</small></a>
      <a class="card" href="rules.html"><i>📘</i><strong>회칙</strong><small>회칙·운영규정</small></a>
    </div>
  </main>

  <nav class="nav">
    <a href="index.html"><b>🏠</b>홈</a><a href="notice.html"><b>📢</b>공지</a><a href="volume.html"><b>🚚</b>물량</a><a href="radio.html"><b>📻</b>무전</a><a href="dashboard.html"><b>📊</b>현황</a><a href="vehicle.html"><b>🛠️</b>차량</a><a href="money.html"><b>💰</b>자금</a><a href="contacts.html"><b>📞</b>연락처</a><a href="rules.html"><b>📘</b>회칙</a>
  </nav>

  <div class="installLayer" id="installLayer" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <div class="installBox">
      <img class="appicon" src="icons/app-icon.png" alt="대왕레미콘 앱 아이콘">
      <h2 id="installTitle">대왕레미콘 설치</h2>
      <p class="lead">사용하는 기기를 선택하면 해당 기기에 맞는 설치 방법으로 진행합니다.</p>

      <div class="platformButtons">
        <button class="platformInstall" data-platform="desktop"><span>💻</span><div>데스크탑 설치<small>Chrome · Edge</small></div></button>
        <button class="platformInstall" data-platform="android"><span>🤖</span><div>안드로이드 설치<small>Chrome</small></div></button>
        <button class="platformInstall" data-platform="ios"><span>🍎</span><div>아이폰 설치<small>홈 화면에 추가</small></div></button>
      </div>

      <div class="installMessage" id="installMessage"></div>
      <button class="closeInstall" id="closeInstall">닫기</button>
    </div>
  </div>

  <script>
    let deferredPrompt = null;

    const installBtn = document.getElementById('installBtn');
    const installLayer = document.getElementById('installLayer');
    const installMessage = document.getElementById('installMessage');
    const platformButtons = [...document.querySelectorAll('.platformInstall')];

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    }

    function currentPlatform() {
      const ua = navigator.userAgent.toLowerCase();
      const ios = /iphone|ipad|ipod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ios) return 'ios';
      if (/android/.test(ua)) return 'android';
      return 'desktop';
    }

    function platformLabel(platform) {
      if (platform === 'ios') return '아이폰';
      if (platform === 'android') return '안드로이드';
      return '데스크탑';
    }

    function setMessage(html) {
      installMessage.innerHTML = html;
    }

    function updateCurrentPlatform() {
      const platform = currentPlatform();
      platformButtons.forEach(button => {
        const active = button.dataset.platform === platform;
        button.classList.toggle('current', active);
        button.setAttribute('aria-current', active ? 'true' : 'false');
      });

      if (isStandalone()) {
        setMessage('✅ <b>이미 설치되어 있습니다.</b><br>홈 화면이나 앱 목록에서 대왕레미콘을 실행하세요.');
      } else if (platform === 'ios') {
        setMessage('현재 기기는 <b>아이폰</b>입니다. 아래의 <b>아이폰 설치</b> 버튼을 누르면 홈 화면 추가 방법을 안내합니다.');
      } else if (platform === 'android') {
        setMessage('현재 기기는 <b>안드로이드</b>입니다. <b>안드로이드 설치</b> 버튼을 누르면 설치창을 엽니다.');
      } else {
        setMessage('현재 기기는 <b>데스크탑</b>입니다. <b>데스크탑 설치</b> 버튼을 누르면 설치창을 엽니다.');
      }
    }

    async function nativeInstall(fallbackHtml) {
      if (isStandalone()) {
        setMessage('✅ <b>이미 설치되어 있습니다.</b><br>홈 화면이나 앱 목록에서 대왕레미콘을 실행하세요.');
        return;
      }

      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (choice && choice.outcome === 'accepted') {
          setMessage('✅ 설치를 진행했습니다. 설치가 끝나면 앱 목록에서 <b>대왕레미콘</b>을 실행하세요.');
        } else {
          setMessage('설치를 취소했습니다. 필요할 때 다시 설치 버튼을 눌러주세요.');
        }
        return;
      }

      setMessage(fallbackHtml);
    }

    async function handlePlatform(target) {
      const actual = currentPlatform();

      if (target === 'desktop') {
        if (actual !== 'desktop') {
          setMessage('💻 데스크탑에서 이 주소를 <b>Chrome 또는 Edge</b>로 연 다음 설치 버튼을 눌러주세요.<br><b>https://tran0004-sudo.github.io/Daewang/</b>');
          return;
        }
        await nativeInstall('설치창이 바로 뜨지 않으면 <b>Chrome/Edge 주소창의 설치 아이콘</b>을 누르거나, 브라우저 메뉴에서 <b>앱 설치</b>를 선택하세요.');
        return;
      }

      if (target === 'android') {
        if (actual !== 'android') {
          setMessage('🤖 안드로이드 휴대폰에서 이 주소를 <b>Chrome</b>으로 연 다음 안드로이드 설치 버튼을 눌러주세요.<br><b>https://tran0004-sudo.github.io/Daewang/</b>');
          return;
        }
        await nativeInstall('설치창이 바로 뜨지 않으면 <b>Chrome 메뉴(⋮) → 앱 설치</b> 또는 <b>홈 화면에 추가</b>를 눌러주세요.');
        return;
      }

      if (target === 'ios') {
        if (actual !== 'ios') {
          setMessage('🍎 아이폰에서 이 주소를 연 다음 <b>아이폰 설치</b> 버튼을 눌러주세요.<br><b>https://tran0004-sudo.github.io/Daewang/</b>');
          return;
        }
        setMessage('🍎 <b>아이폰 설치 방법</b><br>1. Safari에서 대왕레미콘 페이지를 엽니다.<br>2. 아래쪽 <b>공유(□↑)</b> 버튼을 누릅니다.<br>3. <b>홈 화면에 추가</b>를 누릅니다.<br>4. 오른쪽 위 <b>추가</b>를 누르면 대왕레미콘 아이콘이 홈 화면에 생깁니다.');
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      setMessage('✅ <b>설치가 완료되었습니다.</b><br>앱 목록 또는 홈 화면에서 대왕레미콘을 실행하세요.');
      installBtn.textContent = '✅ 설치됨';
    });

    installBtn.addEventListener('click', () => {
      updateCurrentPlatform();
      installLayer.style.display = 'flex';
    });

    platformButtons.forEach(button => {
      button.addEventListener('click', () => handlePlatform(button.dataset.platform));
    });

    document.getElementById('closeInstall').addEventListener('click', () => {
      installLayer.style.display = 'none';
    });

    installLayer.addEventListener('click', event => {
      if (event.target === installLayer) installLayer.style.display = 'none';
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') installLayer.style.display = 'none';
    });

    if (isStandalone()) installBtn.textContent = '✅ 설치됨';
  </script>
</body>
</html>
