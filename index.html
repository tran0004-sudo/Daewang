<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>대왕레미콘 차량운행 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#eef0ee; --paper:#ffffff; --ink:#20252e; --muted:#6b7480; --faint:#9aa2ad;
    --line:#d6dae0; --line2:#e8ebef; --head:#28303b; --head2:#333d4a;
    --brand:#c1272d; --brand-d:#9c1f24; --pos:#1f8f4e; --neg:#d64545; --shadow:0 6px 20px rgba(20,25,35,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 0 92px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  .mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums}
  header{background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .h-title{font-family:'Black Han Sans';font-size:20px;letter-spacing:.5px;line-height:1.1}
  .h-title small{display:block;font-family:'Noto Sans KR';font-weight:500;font-size:11.5px;opacity:.85;letter-spacing:1px;margin-bottom:2px}
  .h-month{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 11px;font-weight:700;font-size:13px;white-space:nowrap}
  .h-actions{display:flex;gap:8px;margin-top:12px}
  .h-btn{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:10px 8px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
  .h-btn.solid{background:#fff;color:var(--brand)}
  .h-btn:active{transform:scale(.97)}
  .radio-btn{background:#fff3!important;color:#fff!important}
  .h-base{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;opacity:.92}
  .h-base input{width:52px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;padding:4px 6px;font-family:'Roboto Mono';font-weight:700;text-align:center}
  main{padding:12px 10px}
  .team{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
  .team-head{display:flex;align-items:center;justify-content:space-between;background:var(--head);color:#fff;padding:9px 12px}
  .team-head .tt{font-family:'Black Han Sans';font-size:15px;letter-spacing:1px}
  .team-head .tt b{color:#ffd23f}
  .donebadge{font-family:'Roboto Mono';font-size:11.5px;font-weight:700;color:#c7ccd3;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 10px}
  .donebadge.all{background:var(--pos);border-color:var(--pos);color:#fff}
  .tt .fin{color:#4ade80;font-size:12px;font-weight:700;margin-left:4px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:max-content;min-width:100%}
  th,td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;font-size:12px;height:38px;white-space:nowrap}
  thead th{background:var(--head2);color:#fff;font-weight:700;font-size:11px;position:sticky;top:0;height:34px;padding:0 2px}
  .c-name{position:sticky;left:0;z-index:5;background:var(--paper);min-width:104px;max-width:104px;text-align:left;padding:0 6px;border-right:2px solid var(--line)}
  .nmwrap{display:flex;align-items:center;gap:6px}
  .chk{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:2px solid var(--line);background:#fff;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
  .chk.on{background:var(--pos);border-color:var(--pos)}
  .nmtext{min-width:0;flex:1;cursor:pointer}
  thead .c-name{z-index:7;background:var(--head2)}
  tbody .c-name .nm{font-weight:700;font-size:12.5px;line-height:1.15}
  tbody .c-name .vn{font-size:10.5px;color:var(--muted);font-family:'Roboto Mono'}
  tbody tr:nth-child(even) td{background:#f7f8f9}
  td.day{min-width:26px;max-width:26px;cursor:pointer;font-family:'Roboto Mono';font-weight:500;color:#2b2f36;position:relative}
  td.sum{min-width:42px;max-width:42px;font-family:'Roboto Mono';font-weight:700;background:#eef3f7;color:#25507a}
  .overlay{position:fixed;inset:0;background:rgba(20,25,35,.55);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--paper);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
  .sheet h2{font-family:'Black Han Sans';font-size:19px;margin-bottom:4px}
  .sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;background:#f4f5f6;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:16px;color:var(--ink)}
  .btn-primary{width:100%;background:var(--brand);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:12px;margin-top:6px}
  .btn-ghost{width:100%;background:#f1f3f5;color:var(--muted);padding:12px;font-size:13px;margin-top:8px;border-radius:10px}
  .warn{background:#fdf3e6;border:1px solid #f2d29b;color:#8a5a12;border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.55;margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.chip{padding:6px 9px;border-radius:20px;background:#eef3f7;font-size:11px;font-weight:700}
  .status{padding:10px;border-radius:10px;background:#edf5ef;color:#176b3b;font-size:12px;text-align:center}
  .ptt{display:block;width:160px;height:160px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:23px;font-weight:900;margin:18px auto;box-shadow:0 10px 24px rgba(193,39,45,.35);touch-action:none}
  .ptt.on{background:var(--pos);transform:scale(.96)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#28303b;color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;opacity:0;transition:.28s;pointer-events:none;max-width:88vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="h-title"><small>대왕레미콘</small>차량운행 현황판</div>
    <button class="h-month" id="monthBtn">2026. 9월</button>
  </div>
  <div class="h-actions">
    <button class="h-btn solid" id="photoBtn">📷 사진으로 입력</button>
    <button class="h-btn radio-btn" id="radioBtn">📻 무전</button>
  </div>
  <div class="h-base"><span>기준 평균</span><input id="baseIn" type="number" inputmode="numeric" value="40"><span>개</span></div>
</header>
<main id="board"></main>
<input type="file" id="fileIn" accept="image/*" capture="environment" style="display:none">
<div class="overlay" id="overlay"></div><div class="toast" id="toast"></div>
<script>
const KEY='daewang_remicon_radio_v3',DAYS=31;
const SEED=[[1,'김경진','5029'],[1,'박재영','5669'],[1,'김상종','7352'],[1,'강경돈','5143'],[1,'박원호','5389'],[2,'정갑천','7348'],[2,'정양환','7296'],[2,'신승수','6461'],[2,'손석목','8728'],[2,'유재수','8437'],[3,'황영호','5596'],[3,'이경구','5361'],[3,'이종학','5880'],[3,'최영득','6980'],[3,'함영철','7303'],[4,'김도호','5384'],[4,'박치화','6690'],[4,'류병곤','5472'],[4,'신해연','5579'],[4,'장병윤','7317'],[5,'박재영','5212'],[5,'이상복','7698'],[5,'조남욱','7569'],[5,'김재환','7701'],[5,'최용규','5606'],[6,'이명신','5280'],[6,'강성호','5210'],[6,'염규삼','7318'],[6,'정희수','7102'],[6,'전종현','5586']];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{month:'2026. 9월',baseline:40,drivers:SEED.map((x,i)=>({id:i+1,team:x[0],name:x[1],vno:x[2],done:false,days:Array(DAYS).fill(0)}))};
const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(state))}let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
function openSheet(html){$('#overlay').innerHTML='<div class="sheet">'+html+'</div>';$('#overlay').classList.add('show')}function closeSheet(){$('#overlay').classList.remove('show');$('#overlay').innerHTML=''}window.closeSheet=closeSheet;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet()};
function render(){let html='';for(let team=1;team<=6;team++){const list=state.drivers.filter(d=>d.team===team),done=list.filter(d=>d.done).length;html+=`<div class="team"><div class="team-head"><div class="tt"><b>${team}</b>조 ${list.length&&done===list.length?'<span class="fin">· 마무리</span>':''}</div><button class="donebadge ${list.length&&done===list.length?'all':''}" onclick="toggleTeam(${team})">✓ ${done}/${list.length}</button></div><div class="scroll"><table><thead><tr><th class="c-name">성명 / 차량No</th>`;for(let i=1;i<=DAYS;i++)html+=`<th>${i}</th>`;html+='<th>합계</th></tr></thead><tbody>';for(const d of list){const sum=d.days.reduce((a,b)=>a+(+b||0),0);html+=`<tr><td class="c-name"><div class="nmwrap"><button class="chk ${d.done?'on':''}" onclick="event.stopPropagation();toggleDone(${d.id})">${d.done?'✓':''}</button><div class="nmtext" onclick="editDriver(${d.id})"><div class="nm">${d.name}</div><div class="vn">${d.vno}</div></div></div></td>`;for(let i=0;i<DAYS;i++){const v=+d.days[i]||0;html+=`<td class="day" onclick="editDay(${d.id},${i})">${v||''}</td>`}html+=`<td class="sum">${sum||''}</td></tr>`}html+='</tbody></table></div></div>'}$('#board').innerHTML=html;$('#monthBtn').textContent=state.month;$('#baseIn').value=state.baseline}
window.toggleDone=id=>{const d=state.drivers.find(x=>x.id===id);d.done=!d.done;save();render()};window.toggleTeam=team=>{const a=state.drivers.filter(x=>x.team===team),all=a.length&&a.every(x=>x.done);a.forEach(x=>x.done=!all);save();render()};
window.editDay=(id,i)=>{const d=state.drivers.find(x=>x.id===id);openSheet(`<h2>${d.name} · ${i+1}일</h2><div class="field"><label>탕수</label><input id="dv" type="number" inputmode="numeric" value="${+d.days[i]||0}"></div><button class="btn-primary" onclick="saveDay(${id},${i})">저장</button><button class="btn-ghost" onclick="closeSheet()">닫기</button>`)};window.saveDay=(id,i)=>{state.drivers.find(x=>x.id===id).days[i]=Math.max(0,+$('#dv').value||0);save();closeSheet();render()};
window.editDriver=id=>{const d=state.drivers.find(x=>x.id===id);openSheet(`<h2>기사 정보</h2><div class="field"><label>성명</label><input id="en" value="${d.name}"></div><div class="field"><label>차량 No.</label><input id="ev" value="${d.vno}"></div><div class="field"><label>조</label><select id="et">${[1,2,3,4,5,6].map(t=>`<option value="${t}" ${t===d.team?'selected':''}>${t}조</option>`).join('')}</select></div><button class="btn-primary" onclick="saveDriver(${id})">저장</button><button class="btn-ghost" onclick="closeSheet()">닫기</button>`)};window.saveDriver=id=>{const d=state.drivers.find(x=>x.id===id);d.name=$('#en').value.trim()||d.name;d.vno=$('#ev').value.trim()||d.vno;d.team=+$('#et').value;save();closeSheet();render()};
$('#baseIn').onchange=()=>{state.baseline=Math.max(0,+$('#baseIn').value||40);save()};
$('#photoBtn').onclick=()=>$('#fileIn').click();$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;openSheet('<h2>사진 문자 인식 중…</h2><div class="sub">기사명, 차량번호, 숫자를 읽고 있습니다.</div>');try{const r=await Tesseract.recognize(f,'kor+eng');const lines=r.data.text.split(/\n+/).map(x=>x.trim()).filter(Boolean);let found=0;for(const line of lines){const v=(line.match(/\b\d{4}\b/)||[])[0];if(!v)continue;const d=state.drivers.find(x=>x.vno===v),nums=line.match(/\b\d{1,2}\b/g)||[];if(d&&nums.length){nums.slice(0,DAYS).forEach((n,i)=>d.days[i]=+n);found++}}save();closeSheet();render();toast(`사진 인식 완료 · ${found}명 반영`)}catch(err){openSheet('<h2>인식 실패</h2><div class="warn">사진을 정면에서 한 조씩 촬영해 다시 시도하세요.</div><button class="btn-primary" onclick="closeSheet()">확인</button>')}};
const CFGKEY='daewang_firebase_cfg',ROOM='daewang-main';let db=null,stream=null,me=null,selfDriver=null,peers=new Map(),audios=new Map(),listeners=[];
function cfg(){try{return JSON.parse(localStorage.getItem(CFGKEY)||'null')}catch{return null}}function firebaseReady(){const c=cfg();if(!c||!c.apiKey||!c.databaseURL||!c.projectId)return false;try{if(!firebase.apps.length)firebase.initializeApp(c);db=firebase.database();return true}catch{return false}}
function setup(){const c=cfg()||{};openSheet(`<h2>📻 무전 설정</h2><div class="sub">Firebase Realtime Database의 웹 앱 설정값을 입력하세요.</div><div class="field"><label>API Key</label><input id="fa" value="${c.apiKey||''}"></div><div class="field"><label>Database URL</label><input id="fd" value="${c.databaseURL||''}"></div><div class="field"><label>Project ID</label><input id="fp" value="${c.projectId||''}"></div><div class="field"><label>Auth Domain</label><input id="fh" value="${c.authDomain||''}"></div><div class="field"><label>App ID</label><input id="fi" value="${c.appId||''}"></div><div class="warn">Realtime Database에서 이 앱의 읽기/쓰기가 허용되어야 합니다. 운영 시 인증과 보안 규칙을 적용하세요.</div><button class="btn-primary" onclick="saveCfg()">설정 저장</button><button class="btn-ghost" onclick="closeSheet()">닫기</button>`)}window.saveCfg=()=>{const c={apiKey:$('#fa').value.trim(),databaseURL:$('#fd').value.trim(),projectId:$('#fp').value.trim(),authDomain:$('#fh').value.trim(),appId:$('#fi').value.trim()};if(!c.apiKey||!c.databaseURL||!c.projectId)return toast('필수 설정값을 입력하세요');localStorage.setItem(CFGKEY,JSON.stringify(c));closeSheet();toast('무전 설정 저장됨')};
function openRadio(){const checked=state.drivers.filter(x=>x.done);if(!checked.length)return toast('먼저 무전할 기사에 체크하세요');if(!firebaseReady())return setup();openSheet(`<h2>📻 실시간 무전</h2><div class="sub">체크한 기사만 무전 대상입니다. 각 휴대폰에서 본인 이름을 선택하세요.</div><div class="chips">${checked.map(x=>`<span class="chip">✓ ${x.name}</span>`).join('')}</div><div class="field"><label>내 기사 선택</label><select id="self">${checked.map(x=>`<option value="${x.id}">${x.name} · ${x.vno}</option>`).join('')}</select></div><button id="join" class="btn-primary" onclick="joinRadio()">무전방 참가</button><div id="live" hidden><div id="status" class="status">연결 준비 중…</div><div id="members" class="chips"></div><button id="ptt" class="ptt">누르고<br>말하기</button><button class="btn-ghost" onclick="leaveRadio();closeSheet()">무전방 나가기</button></div><button class="btn-ghost" onclick="setup()">⚙ Firebase 설정</button>`)}$('#radioBtn').onclick=openRadio;
async function peer(id,offer){if(peers.has(id))return peers.get(id);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(id,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)db.ref(`radio/${ROOM}/cand/${id}/${me}`).push(e.candidate.toJSON())};pc.ontrack=e=>{let a=audios.get(id)||document.createElement('audio');a.autoplay=true;a.playsInline=true;a.srcObject=e.streams[0];if(!audios.has(id)){document.body.appendChild(a);audios.set(id,a)}};if(offer){const o=await pc.createOffer();await pc.setLocalDescription(o);await db.ref(`radio/${ROOM}/offers/${id}/${me}`).set({type:o.type,sdp:o.sdp})}return pc}
window.joinRadio=async()=>{try{selfDriver=state.drivers.find(x=>x.id==$('#self').value);me='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});stream.getAudioTracks().forEach(t=>t.enabled=false);$('#join').hidden=true;$('#live').hidden=false;const root=db.ref(`radio/${ROOM}`),m=root.child('members');await m.child(me).set({name:selfDriver.name,vno:selfDriver.vno});m.child(me).onDisconnect().remove();let cb=m.on('value',s=>{const o=s.val()||{};$('#members').innerHTML=Object.values(o).map(x=>`<span class="chip">🔊 ${x.name}</span>`).join('');$('#status').textContent=`연결 인원 ${Object.keys(o).length}명`});listeners.push([m,'value',cb]);cb=m.on('child_added',s=>{if(s.key!==me&&me<s.key)peer(s.key,true)});listeners.push([m,'child_added',cb]);let r=root.child(`offers/${me}`);cb=r.on('child_added',async s=>{const pc=await peer(s.key,false);await pc.setRemoteDescription(s.val());const a=await pc.createAnswer();await pc.setLocalDescription(a);await root.child(`answers/${s.key}/${me}`).set({type:a.type,sdp:a.sdp})});listeners.push([r,'child_added',cb]);r=root.child(`answers/${me}`);cb=r.on('child_added',async s=>{const pc=peers.get(s.key);if(pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(s.val())});listeners.push([r,'child_added',cb]);r=root.child(`cand/${me}`);cb=r.on('child_added',s=>{const src=s.key,c=s.ref.on('child_added',async x=>{const pc=await peer(src,false);try{await pc.addIceCandidate(x.val())}catch{}});listeners.push([s.ref,'child_added',c])});listeners.push([r,'child_added',cb]);const b=$('#ptt'),tx=v=>{stream.getAudioTracks().forEach(t=>t.enabled=v);b.classList.toggle('on',v);b.innerHTML=v?'송신 중…':'누르고<br>말하기'};['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();tx(true)},{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();tx(false)},{passive:false}))}catch(e){toast(e.name==='NotAllowedError'?'마이크 권한을 허용하세요':'무전 연결 실패')}};
window.leaveRadio=async()=>{try{if(db&&me)await db.ref(`radio/${ROOM}/members/${me}`).remove()}catch{}listeners.forEach(x=>{try{x[0].off(x[1],x[2])}catch{}});listeners=[];peers.forEach(x=>x.close());peers.clear();audios.forEach(x=>x.remove());audios.clear();if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;me=null};
render();
</script>
<script src="radio-admin-sync.js"></script>
</body>
</html>
