dding:26px 22px;text-align:center;box-shadow:0 20px 60px #0005}.appicon{width:100px;height:100px;border-radius:23px;box-shadow:0 8px 24px #0002;margin-bottom:12px}.installBox h2{margin:4px 0 6px;font-size:24px}.installBox p{margin:0 0 18px;color:#68717d;font-size:14px;line-height:1.55}.bigInstall{width:100%;border:0;border-radius:14px;padding:15px;background:#c1272d;color:#fff;font-size:17px;font-weight:900}.closeInstall{margin-top:10px;border:0;background:none;color:#7b838c;padding:8px}</style></head><body><header><div class="brand"><b>대왕레미콘</b><div style="font-size:12px;opacity:.85">DAEWANG REMICON</div></div><button class="install" id="installBtn">📲 앱 설치</button></header><main class="home"><div class="grid"><a class="card" href="notice.html"><i>📢</i><strong>공지사항</strong><small>회사 공지 확인</small></a><a class="card" href="volume.html"><i>🚚</i><strong>오늘물량</strong><small>오늘 물량·배차</small></a><a class="card" href="radio.html"><i>📻</i><strong>무전</strong><small>실시간 무전</small></a><a class="card" href="dashboard.html"><i>📊</i><strong>현황판</strong><small>차량운행 현황</small></a><a class="card" href="vehicle.html"><i>🛠️</i><strong>차량관리</strong><small>개인 정비·점검·교체주기</small></a><a class="card" href="money.html"><i>💰</i><strong>자금관리</strong><small>실시간 공동장부</small></a><a class="card" href="contacts.html"><i>📞</i><strong>연락처</strong><small>도급·협력업체</small></a><a class="card" href="rules.html"><i>📘</i><strong>회칙</strong><small>회칙·운영규정</small></a></div></main><nav class="nav"><a href="index.html"><b>🏠</b>홈</a><a href="notice.html"><b>📢</b>공지</a><a href="volume.html"><b>🚚</b>물량</a><a href="radio.html"><b>📻</b>무전</a><a href="dashboard.html"><b>📊</b>현황</a><a href="vehicle.html"><b>🛠️</b>차량</a><a href="money.html"><b>💰</b>자금</a><a href="contacts.html"><b>📞</b>연락처</a><a href="rules.html"><b>📘</b>회칙</a></nav><div class="installLayer" id="installLayer"><div class="installBox"><img class="appicon" src="icons/app-icon.png" alt="대왕레미콘 앱 아이콘"><h2>대왕레미콘</h2><p id="installText">휴대폰 홈 화면에 앱으로 설치합니다.</p><button class="bigInstall" id="bigInstall">대왕레미콘 앱 설치</button><button class="closeInstall" id="closeInstall">닫기</button></div></div><script>let deferredPrompt=null;let installRequested=false;const btn=document.getElementById('installBtn'),layer=document.getElementById('installLayer'),big=document.getElementById('bigInstall'),txt=document.getElementById('installText');if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready}catch(e){}});window.addEventListener('beforeinstallprompt',async e=>{e.preventDefault();deferredPrompt=e;if(installRequested){installRequested=false;const p=deferredPrompt;deferredPrompt=null;await p.prompt();await p.userChoice}});window.addEventListener('appinstalled',()=>{layer.style.display='none';btn.style.display='none';deferredPrompt=null;installRequested=false});function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}async function install(){if(standalone()){txt.textContent='이미 대왕레미콘 앱으로 설치되어 있습니다.';big.style.display='none';layer.style.display='flex';return}if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;await p.prompt();await p.userChoice;return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(ios){txt.innerHTML='아이폰은 Safari의 <b>공유(□↑) → 홈 화면에 추가</b>를 눌러주세요.';big.style.display='none';layer.style.display='flex';return}installRequested=true;txt.innerHTML='<b>설치 준비 중입니다.</b><br>설치창이 뜨면 설치를 눌러주세요. 바로 뜨지 않으면 Chrome 메뉴에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 선택하세요.';big.style.display='none';layer.style.display='flex'}btn.onclick=install;big.onclick=install;document.getElementById('closeInstall').onclick=()=>{layer.style.display='none';installRequested=false};</script></body></html>
