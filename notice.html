<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c1272d"><title>대왕레미콘 공지사항</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef0ee;font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e;padding-bottom:26px}button,input,textarea{font:inherit}header{position:sticky;top:0;z-index:20;background:#c1272d;color:#fff;padding:14px 12px;display:flex;align-items:center;gap:10px}.back{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:9px;padding:8px 10px;font-weight:700}.title{font-size:20px;font-weight:900}.wrap{max-width:760px;margin:auto;padding:12px}.writer,.notice{background:#fff;border:1px solid #dde1e5;border-radius:14px;padding:14px;box-shadow:0 4px 14px #0000000a}.writer{margin-bottom:12px}.writer h3{margin:0 0 11px;font-size:17px}.writer input,.writer textarea{width:100%;border:1px solid #d8dde3;background:#f8f9fa;border-radius:10px;padding:11px;margin-bottom:8px}.writer textarea{min-height:105px;resize:vertical}.voiceRow{display:flex;gap:8px;align-items:center;margin:2px 0 8px}.voiceBtn{flex:1;border:0;border-radius:10px;padding:12px;font-weight:800;background:#eef1f4;color:#333}.voiceBtn.rec{background:#c1272d;color:#fff}.voiceBtn.stop{background:#303844;color:#fff}.timer{font-size:12px;color:#6f7782;min-width:54px;text-align:right}.preview{display:none;margin:8px 0}.preview.on{display:block}.preview audio{width:100%}.save{width:100%;border:0;border-radius:10px;background:#c1272d;color:#fff;padding:13px;font-weight:900}.hint{font-size:11px;color:#777;margin-top:8px;line-height:1.45}.status{font-size:12px;color:#6f7782;margin:2px 2px 10px}.notice{margin-bottom:10px}.notice h3{margin:0 0 7px;font-size:17px}.meta{font-size:11px;color:#7b838d;margin-bottom:10px}.body{white-space:pre-wrap;line-height:1.55;font-size:14px}.notice audio{width:100%;margin-top:10px}.noticeFoot{display:flex;justify-content:flex-end;margin-top:9px}.del{border:0;background:#f1f3f5;color:#666;border-radius:8px;padding:7px 10px;font-size:11px}.empty{text-align:center;color:#7c848e;background:#fff;border:1px solid #dde1e5;border-radius:14px;padding:28px 12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:5px}.dot.on{background:#19a15d}.dot.off{background:#d33}</style></head><body><header><button class="back" onclick="location.href='index.html'">← 홈</button><div class="title">📢 공지사항</div></header><main class="wrap"><section class="writer"><h3>공지 글쓰기</h3><input id="noticeTitle" placeholder="제목"><textarea id="noticeBody" placeholder="공지 내용을 입력하세요"></textarea><div class="voiceRow"><button class="voiceBtn rec" id="recBtn">🎙 음성 녹음</button><button class="voiceBtn stop" id="stopBtn" disabled>■ 녹음 종료</button><span class="timer" id="timer">00:00</span></div><div class="preview" id="preview"><audio id="previewAudio" controls></audio><button class="voiceBtn" id="clearVoice" style="margin-top:6px;width:100%">음성 지우기</button></div><button class="save" id="saveBtn">공지 저장</button><div class="hint">글만 저장하거나 음성을 함께 저장할 수 있습니다. 음성은 최대 60초까지 녹음됩니다.</div></section><div class="status"><span class="dot" id="dot"></span><span id="syncText">실시간 공지 연결 중…</span></div><section id="list"></section></main><script>const FB={apiKey:'AIzaSyDfAUpbzd_tB6Da-6kRedtuz9G5u7Km7E0',authDomain:'daewang-radio-e1370.firebaseapp.com',databaseURL:'https://daewang-radio-e1370-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'daewang-radio-e1370',storageBucket:'daewang-radio-e1370.firebasestorage.app',appId:'1:56169646168:web:16e5dc67b7acdfa5b1e22d'};if(!firebase.apps.length)firebase.initializeApp(FB);const db=firebase.database(),ref=db.ref('notices');const $=s=>document.querySelector(s);let mediaRecorder=null,chunks=[],voiceData='',voiceType='audio/webm',timerInt=null,startedAt=0,maxTimer=null;function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function fmtTime(ms){const d=new Date(ms||Date.now());return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function setTimer(){const sec=Math.floor((Date.now()-startedAt)/1000);$('#timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function resetVoice(){voiceData='';$('#preview').classList.remove('on');$('#previewAudio').removeAttribute('src');$('#timer').textContent='00:00'}async function blobToDataURL(blob){return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}$('#recBtn').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return alert('이 브라우저에서는 음성 녹음을 지원하지 않습니다.');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const opt=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{};mediaRecorder=new MediaRecorder(stream,opt);voiceType=mediaRecorder.mimeType||'audio/webm';mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(timerInt);clearTimeout(maxTimer);const blob=new Blob(chunks,{type:voiceType});if(blob.size>2.5*1024*1024){resetVoice();return alert('음성 파일이 너무 큽니다. 더 짧게 녹음해주세요.')}voiceData=await blobToDataURL(blob);$('#previewAudio').src=voiceData;$('#preview').classList.add('on');$('#recBtn').disabled=false;$('#stopBtn').disabled=true};mediaRecorder.start();startedAt=Date.now();setTimer();timerInt=setInterval(setTimer,500);maxTimer=setTimeout(()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()},60000);$('#recBtn').disabled=true;$('#stopBtn').disabled=false}catch(e){alert('마이크 권한을 허용해주세요.')}};$('#stopBtn').onclick=()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()};$('#clearVoice').onclick=resetVoice;$('#saveBtn').onclick=async()=>{const title=$('#noticeTitle').value.trim(),body=$('#noticeBody').value.trim();if(!title&&!body&&!voiceData)return alert('공지 내용이나 음성을 입력해주세요.');const b=$('#saveBtn');b.disabled=true;b.textContent='저장 중…';try{const n=ref.push();await n.set({title,body,audio:voiceData||'',audioType:voiceData?voiceType:'',createdAt:firebase.database.ServerValue.TIMESTAMP});$('#noticeTitle').value='';$('#noticeBody').value='';resetVoice()}catch(e){alert('공지 저장에 실패했습니다. 인터넷 연결 또는 Firebase 권한을 확인해주세요.')}finally{b.disabled=false;b.textContent='공지 저장'}};function render(snap){const a=[];snap.forEach(c=>{const v=c.val()||{};v.id=c.key;a.push(v)});a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));$('#list').innerHTML=a.length?a.map(n=>`<article class="notice"><h3>${esc(n.title||'공지')}</h3><div class="meta">${fmtTime(n.createdAt)}</div>${n.body?`<div class="body">${esc(n.body)}</div>`:''}${n.audio?`<audio controls preload="metadata" src="${n.audio}"></audio>`:''}<div class="noticeFoot"><button class="del" data-id="${n.id}">삭제</button></div></article>`).join(''):'<div class="empty">등록된 공지가 없습니다.</div>';$('#list').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('이 공지를 삭제할까요?'))return;try{await ref.child(b.dataset.id).remove()}catch(e){alert('삭제에 실패했습니다.')}})}ref.on('value',render,()=>{$('#syncText').textContent='공지 읽기 실패';$('#dot').className='dot off'});db.ref('.info/connected').on('value',s=>{const on=s.val()===true;$('#dot').className='dot '+(on?'on':'off');$('#syncText').textContent=on?'실시간 공지 연결됨':'인터넷 연결 대기 중'});</script></body></html>
