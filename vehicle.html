<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>대왕레미콘 차량관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c; --panel:#1d2229; --panel-2:#232a33; --line:#2c333d;
    --ink:#e8eaed; --muted:#8a94a3; --faint:#5b6472;
    --ok:#3dd68c; --warn:#f5a623; --danger:#ff5f56; --amber:#ffb03a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;min-height:100vh;padding:0 0 96px;position:relative;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;letter-spacing:.3px}
  .mono{font-family:'Roboto Mono',monospace}

  header{background:linear-gradient(180deg,#181c22,#14171c);border-bottom:1px solid var(--line);padding:18px 18px 20px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}.brand-left{display:flex;align-items:center;gap:9px;min-width:0}.homebtn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700}.homebtn:active{transform:scale(.96)}
  .brand .name{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .brand .name b{color:var(--amber);font-weight:700}
  .bell{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;transition:.2s}
  .bell.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}.bell:active{transform:scale(.94)}
  .odo-label{font-family:'Oswald';text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--faint);margin-bottom:6px}.odo{display:flex;align-items:flex-end;gap:10px}.odo-digits{display:flex;gap:3px;cursor:pointer}.digit{background:#0d0f12;border:1px solid #000;border-radius:4px;min-width:30px;height:46px;display:grid;place-items:center;font-family:'Roboto Mono';font-weight:700;font-size:30px;color:var(--amber);text-shadow:0 0 12px rgba(255,176,58,.35);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}.digit.sep{background:none;border:none;box-shadow:none;min-width:6px;color:var(--faint);text-shadow:none}.odo-unit{font-family:'Oswald';font-size:16px;color:var(--muted);padding-bottom:6px}.odo-hint{font-size:11px;color:var(--faint);margin-top:8px}
  .tabs{display:flex;gap:6px;background:var(--panel);margin:14px 18px 0;padding:5px;border-radius:12px;border:1px solid var(--line)}.tab{flex:1;padding:11px 2px;text-align:center;font-family:'Oswald';font-weight:500;font-size:13px;letter-spacing:.3px;color:var(--muted);border-radius:8px;transition:.18s;white-space:nowrap}.tab.active{background:var(--panel-2);color:var(--ink);box-shadow:var(--shadow)}.tab .cnt{display:inline-block;min-width:18px;font-family:'Roboto Mono';font-size:11px;background:var(--danger);color:#14171c;border-radius:20px;padding:1px 5px;margin-left:5px;font-weight:700;vertical-align:1px}.tab .cnt.zero{display:none}
  main{padding:16px 18px}.section-eyebrow{font-family:'Oswald';text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:8px;margin:4px 2px 12px}.section-eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
  .banner{border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;border:1px solid}.banner.red{background:rgba(255,95,86,.09);border-color:rgba(255,95,86,.35)}.banner.amber{background:rgba(245,166,35,.09);border-color:rgba(245,166,35,.35)}.banner.green{background:rgba(61,214,140,.07);border-color:rgba(61,214,140,.28)}.banner .ic{font-size:20px;line-height:1.2}.banner .t{font-family:'Oswald';font-weight:600;font-size:15px;margin-bottom:2px}.banner.red .t{color:var(--danger)} .banner.amber .t{color:var(--warn)} .banner.green .t{color:var(--ok)}.banner .d{font-size:12.5px;color:var(--muted);line-height:1.55}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;position:relative;overflow:hidden}.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}.card.s-ok::before{background:var(--ok)} .card.s-warn::before{background:var(--warn)} .card.s-danger::before{background:var(--danger)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.card-name{display:flex;align-items:center;gap:9px;min-width:0}.card-name .ico{font-size:19px;flex-shrink:0}.card-name h3{font-family:'Oswald';font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-pill{flex-shrink:0;font-family:'Roboto Mono';font-weight:700;font-size:11px;padding:4px 9px;border-radius:20px;letter-spacing:.3px}.s-ok .status-pill{background:rgba(61,214,140,.14);color:var(--ok)}.s-warn .status-pill{background:rgba(245,166,35,.16);color:var(--warn)}.s-danger .status-pill{background:rgba(255,95,86,.16);color:var(--danger)}
  .gauge{height:9px;border-radius:6px;background:#0e1116;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}.gauge .fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}.s-ok .fill{background:linear-gradient(90deg,#2fae74,var(--ok))}.s-warn .fill{background:linear-gradient(90deg,#c9861a,var(--warn))}.s-danger .fill{background:linear-gradient(90deg,#d8443c,var(--danger))}.card-meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px}.remain{font-size:12px;color:var(--muted)}.remain b{font-family:'Roboto Mono';font-size:15px;color:var(--ink);font-weight:700}.s-danger .remain b{color:var(--danger)}.sub{font-size:11px;color:var(--faint);font-family:'Roboto Mono';text-align:right;line-height:1.5}.card-actions{display:flex;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.card-actions button{flex:1;padding:9px 0;border-radius:9px;font-family:'Oswald';font-weight:500;font-size:13px;letter-spacing:.5px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}.card-actions button.done{color:var(--ok);border-color:rgba(61,214,140,.3)}.card-actions button:active{transform:scale(.97)}
  .card.s-daily::before{background:#5a83c9}.s-daily .status-pill{background:rgba(90,131,201,.18);color:#8fb0e8}.ins-sub{font-size:12.5px;color:var(--muted);margin-top:2px}.ins-sub b{font-family:'Roboto Mono';color:var(--ink);font-size:14px}.s-danger .ins-sub b{color:var(--danger)}.checklist{margin-top:13px;border-top:1px solid var(--line)}.chk-row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}.chk-row:last-child{border-bottom:none}.chk-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;transition:.15s;font-size:13px;font-weight:700}.chk-row.on .chk-box{background:var(--ok);border-color:var(--ok);color:#14171c}.chk-row .txt{flex:1;font-size:13.5px;color:var(--ink);line-height:1.4}.chk-row.on .txt{color:var(--faint);text-decoration:line-through}.chk-del{color:var(--faint);font-size:12px;padding:6px 4px;flex-shrink:0;opacity:.6}.chk-del:active{color:var(--danger)}
  .summary{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.summary .mlabel{font-family:'Oswald';text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--faint)}.summary .total{font-family:'Roboto Mono';font-weight:700;font-size:32px;margin:2px 0 14px}.summary .total small{font-size:16px;color:var(--muted);font-weight:500}.breakdown{display:flex;flex-direction:column;gap:9px}.bd-row{display:flex;align-items:center;gap:10px;font-size:12.5px}.bd-row .k{width:82px;flex-shrink:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bd-bar{flex:1;height:7px;background:#0e1116;border-radius:5px;overflow:hidden}.bd-bar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#5a6b8a,var(--amber))}.bd-row .v{font-family:'Roboto Mono';font-weight:700;font-size:12px;width:72px;text-align:right;flex-shrink:0}.exp{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}.exp .cat{width:44px;height:44px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;font-size:19px;flex-shrink:0}.exp .info{flex:1;min-width:0}.exp .info .top{display:flex;gap:8px;align-items:baseline}.exp .info h4{font-family:'Oswald';font-weight:500;font-size:15px}.exp .info .cn{font-size:10.5px;color:var(--faint);font-family:'Roboto Mono';border:1px solid var(--line);padding:1px 6px;border-radius:5px}.exp .info .memo{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exp .amt{text-align:right;flex-shrink:0}.exp .amt .n{font-family:'Roboto Mono';font-weight:700;font-size:15px}.exp .amt .del{font-size:11px;color:var(--faint);margin-top:2px}.empty{text-align:center;padding:44px 20px;color:var(--faint)}.empty .e-ic{font-size:40px;opacity:.4;margin-bottom:12px}.empty .e-t{font-family:'Oswald';font-size:16px;color:var(--muted);margin-bottom:4px}.empty .e-d{font-size:12.5px;line-height:1.6}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:30;background:var(--amber);color:#14171c;font-family:'Oswald';font-weight:700;font-size:15px;letter-spacing:.5px;padding:14px 26px;border-radius:30px;box-shadow:0 8px 24px rgba(255,176,58,.35);display:flex;align-items:center;gap:8px;max-width:min(84vw,480px);transition:.2s}.fab:active{transform:translateX(-50%) scale(.96)}.fab.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
  .overlay{position:fixed;inset:0;background:rgba(8,10,13,.72);backdrop-filter:blur(3px);z-index:40;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:rise .28s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}.grabber{width:38px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 16px}.sheet h2{font-family:'Oswald';font-weight:600;font-size:20px;margin-bottom:18px}.field{margin-bottom:15px}.field label{display:block;font-family:'Oswald';text-transform:uppercase;letter-spacing:1px;font-size:11px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;background:#0e1116;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--ink);font-size:16px}.field input:focus,.field select:focus{outline:none;border-color:var(--amber)}.field.mono input{font-family:'Roboto Mono';font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:9px 13px;border-radius:20px;background:#0e1116;border:1px solid var(--line);font-size:13px;color:var(--muted);transition:.15s}.chip.sel{background:rgba(255,176,58,.15);border-color:var(--amber);color:var(--amber);font-weight:500}.chip.add{border-style:dashed;color:var(--faint)}.row2{display:flex;gap:11px}.row2>*{flex:1}.btn-primary{width:100%;background:var(--amber);color:#14171c;font-family:'Oswald';font-weight:700;font-size:16px;letter-spacing:.5px;padding:15px;border-radius:12px;margin-top:8px}.btn-primary:active{transform:scale(.98)}.btn-ghost{width:100%;background:none;color:var(--muted);padding:13px;font-size:13px;margin-top:4px}.btn-danger{color:var(--danger)}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:60;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:12px 20px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-left"><button class="homebtn" onclick="location.href='index.html'">← 홈</button><div class="name">대왕레미콘 <b>차량관리</b><br><span style="font-size:11px;letter-spacing:.5px">뉴파워믹스트럭 · 정비수첩</span></div></div>
    <button class="bell" id="bell" title="교체 알림">🔔</button>
  </div>
  <div class="odo-label">현재 주행거리 · ODOMETER</div>
  <div class="odo"><div class="odo-digits" id="odoDigits" title="탭하여 수정"></div><span class="odo-unit">km</span></div>
  <div class="odo-hint">숫자를 탭하면 현재 주행거리를 입력할 수 있어요.</div>
</header>
<div class="tabs">
  <button class="tab active" data-tab="maint">교체주기 <span class="cnt zero" id="alertCnt">0</span></button>
  <button class="tab" data-tab="inspect">점검목록 <span class="cnt zero" id="inspectCnt">0</span></button>
  <button class="tab" data-tab="ledger">가계부</button>
</div>
<main>
  <section id="view-maint"><div id="bannerWrap"></div><div class="section-eyebrow">소모품 상태 · 긴급한 순</div><div id="maintList"></div></section>
  <section id="view-inspect" style="display:none"><div class="section-eyebrow">킬로수별 점검 · 확인 항목</div><div id="inspectList"></div><p style="font-size:11.5px;color:var(--faint);line-height:1.7;margin:14px 2px 0">점검은 교체와 달리 <b style="color:var(--muted)">상태 확인</b>이 목적입니다. 이상이 있으면 교체주기 탭에서 조치하세요. 각 항목을 탭해 체크하고, 구간 점검이 끝나면 <b style="color:var(--muted)">점검 완료</b>를 누르면 다음 점검 시점이 갱신됩니다.</p></section>
  <section id="view-ledger" style="display:none"><div id="summaryWrap"></div><div class="section-eyebrow">지출 내역</div><div id="expList"></div></section>
</main>
<button class="fab" id="fab"><span id="fabIcon">＋</span> <span id="fabText">지출 추가</span></button>
<div class="overlay" id="overlay"></div><div class="toast" id="toast"></div>
<script>
const KEY='newpower_truck_v1';
const DEFAULT_ITEMS=[{id:'oil',name:'엔진오일',icon:'🛢️',interval:15000,lastKm:0},{id:'oilfil',name:'엔진오일 필터',icon:'🔩',interval:15000,lastKm:0},{id:'grease',name:'구리스 주입(드럼·롤러)',icon:'🧴',interval:5000,lastKm:0},{id:'hydoil',name:'유압작동유(드럼 구동)',icon:'💧',interval:60000,lastKm:0},{id:'hydfil',name:'유압 오일필터',icon:'🧫',interval:20000,lastKm:0},{id:'reducer',name:'드럼 감속기 오일',icon:'🥁',interval:40000,lastKm:0},{id:'belt',name:'구동벨트',icon:'➰',interval:40000,lastKm:0},{id:'fuelfil',name:'연료필터',icon:'⛽',interval:40000,lastKm:0},{id:'air',name:'에어클리너',icon:'💨',interval:20000,lastKm:0},{id:'coolant',name:'냉각수(부동액)',icon:'❄️',interval:40000,lastKm:0},{id:'brake',name:'브레이크 라이닝',icon:'🛑',interval:60000,lastKm:0},{id:'power',name:'파워스티어링 오일',icon:'🔧',interval:60000,lastKm:0},{id:'tire',name:'타이어',icon:'🛞',interval:80000,lastKm:0},{id:'mission',name:'미션오일(변속기)',icon:'⚙️',interval:100000,lastKm:0},{id:'diff',name:'데후오일(차동)',icon:'🔗',interval:100000,lastKm:0}];
const DEFAULT_INSPECT=[{id:'daily',name:'일상점검',icon:'🧭',interval:0,lastKm:0,items:[{t:'타이어 공기압 · 마모 · 이물질',c:false},{t:'엔진오일 · 냉각수 · 워셔액 레벨',c:false},{t:'브레이크 · 주차브레이크 작동',c:false},{t:'전조등 · 방향지시등 · 제동등',c:false},{t:'와이퍼 · 경음기 작동',c:false},{t:'적재물 결박 · 하부 누유',c:false}]},{id:'ins2',name:'2만km 정기점검',icon:'🔧',interval:20000,lastKm:0,items:[{t:'각종 벨트 장력 · 균열',c:false},{t:'배터리 단자 · 충전 상태',c:false},{t:'각종 호스 노후 · 누유',c:false},{t:'에어탱크 수분 배출(드레인)',c:false},{t:'하부 볼트 조임 상태',c:false}]},{id:'ins4',name:'4만km 정기점검',icon:'🛠️',interval:40000,lastKm:0,items:[{t:'브레이크 라이닝 · 드럼/디스크',c:false},{t:'조향장치 유격 · 링키지',c:false},{t:'클러치 유격 · 작동',c:false},{t:'배기 · 매연 상태',c:false},{t:'전기 배선 · 등화 전체',c:false}]},{id:'ins8',name:'8만km 정기점검',icon:'🚚',interval:80000,lastKm:0,items:[{t:'서스펜션 · 쇼바 · 판스프링',c:false},{t:'휠 얼라인먼트 · 허브베어링',c:false},{t:'추진축 · 유니버설 조인트',c:false},{t:'냉각 계통 전체 점검',c:false},{t:'프레임 · 마운팅 균열',c:false}]},{id:'drumDaily',name:'믹서 드럼 일상점검',icon:'🌀',interval:0,lastKm:0,items:[{t:'유압유 레벨 · 계기 경고등',c:false},{t:'드럼 정회전 · 역회전 작동',c:false},{t:'드럼 이상음 · 진동 여부',c:false},{t:'유압 호스 · 피팅 누유',c:false},{t:'급수탱크 수량 · 워터펌프 작동',c:false},{t:'배출 슈트 상태 · 잠금 · 결박',c:false},{t:'드럼 내부 굳은 콘크리트 세척',c:false}]},{id:'drumReg',name:'믹서 드럼 정기점검',icon:'🥁',interval:10000,lastKm:0,items:[{t:'드럼 블레이드(날개) 마모 · 굳음',c:false},{t:'받침롤러 유격 · 마모',c:false},{t:'후방 베어링 유격 · 소음 · 구리스',c:false},{t:'드럼 구동벨트 장력 · 균열',c:false},{t:'PTO 작동 · 소음',c:false},{t:'감속기 누유 · 소음',c:false},{t:'드럼 마운팅 볼트 조임',c:false}]}];
const DEFAULT_CATS=[{name:'소모품교체',icon:'🔧'},{name:'주유',icon:'⛽'},{name:'수리',icon:'🛠️'},{name:'보험',icon:'📄'},{name:'통행료',icon:'🛣️'},{name:'기타',icon:'📌'}];
let state=load();function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items){s.notifyKm=s.notifyKm??1500;s.notifyOn=s.notifyOn??false;s.categories=s.categories||DEFAULT_CATS.slice();s.inspections=s.inspections||JSON.parse(JSON.stringify(DEFAULT_INSPECT));DEFAULT_ITEMS.forEach(d=>{if(!s.items.some(i=>i.id===d.id))s.items.push(JSON.parse(JSON.stringify(d)));});DEFAULT_INSPECT.forEach(d=>{if(!s.inspections.some(g=>g.id===d.id))s.inspections.push(JSON.parse(JSON.stringify(d)));});return s;}}catch(e){}return{currentKm:0,items:JSON.parse(JSON.stringify(DEFAULT_ITEMS)),expenses:[],categories:DEFAULT_CATS.slice(),inspections:JSON.parse(JSON.stringify(DEFAULT_INSPECT)),notifyKm:1500,notifyOn:false};}function save(){localStorage.setItem(KEY,JSON.stringify(state));}
const $=s=>document.querySelector(s);const won=n=>new Intl.NumberFormat('ko-KR').format(Math.round(n));const km=n=>new Intl.NumberFormat('ko-KR').format(Math.round(n));function statusOf(it){const remain=it.lastKm+it.interval-state.currentKm;const ratio=Math.max(0,Math.min(1,(state.currentKm-it.lastKm)/it.interval));let s='ok';if(remain<=0)s='danger';else if(remain<=state.notifyKm)s='warn';return{remain,ratio,s};}function catIcon(name){const c=state.categories.find(c=>c.name===name);return c?c.icon:'📌';}let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function renderOdo(){const s=km(state.currentKm).split('');$('#odoDigits').innerHTML=s.map(ch=>ch===','?`<div class="digit sep">,</div>`:`<div class="digit">${ch}</div>`).join('');}
function alertCount(){return state.items.filter(it=>statusOf(it).s!=='ok').length;}function renderMaint(){const dangers=state.items.filter(it=>statusOf(it).s==='danger');const warns=state.items.filter(it=>statusOf(it).s==='warn');let bw='';if(dangers.length){bw=`<div class="banner red"><div class="ic">⚠️</div><div><div class="t">교체 시기를 넘긴 항목 ${dangers.length}건</div><div class="d">${dangers.map(d=>d.name).join(', ')} — 지금 점검하고 교체하세요.</div></div></div>`;}else if(warns.length){bw=`<div class="banner amber"><div class="ic">🔔</div><div><div class="t">곧 교체할 항목 ${warns.length}건</div><div class="d">${warns.map(w=>{const r=statusOf(w).remain;return `${w.name}(${km(r)}km 남음)`;}).join(', ')}</div></div></div>`;}else{bw=`<div class="banner green"><div class="ic">✓</div><div><div class="t">모든 소모품 정상</div><div class="d">가장 가까운 교체까지 여유가 있습니다. 주행거리를 꾸준히 업데이트하세요.</div></div></div>`;}$('#bannerWrap').innerHTML=bw;const sorted=[...state.items].sort((a,b)=>statusOf(a).remain-statusOf(b).remain);$('#maintList').innerHTML=sorted.map(it=>{const{remain,ratio,s}=statusOf(it);const pill=s==='danger'?'교체 필요':s==='warn'?'교체 임박':'양호';const remainTxt=remain<=0?`<b>${km(-remain)} km</b> 초과`:`다음 교체까지 <b>${km(remain)} km</b>`;const lastTxt=it.lastKm>0?`직전 교체 ${km(it.lastKm)}km`:'교체 이력 없음';return`<div class="card s-${s}"><div class="card-top"><div class="card-name"><span class="ico">${it.icon}</span><h3>${it.name}</h3></div><span class="status-pill">${pill}</span></div><div class="gauge"><div class="fill" style="width:${ratio*100}%"></div></div><div class="card-meta"><div class="remain">${remainTxt}</div><div class="sub">주기 ${km(it.interval)}km<br>${lastTxt}</div></div><div class="card-actions"><button class="done" onclick="markDone('${it.id}')">✓ 교체 완료</button><button onclick="editItem('${it.id}')">주기·이력 수정</button></div></div>`;}).join('');const c=$('#alertCnt'),n=alertCount();c.textContent=n;c.classList.toggle('zero',n===0);}
function inspectStatus(g){if(g.interval===0)return{s:'daily',remain:null};const remain=g.lastKm+g.interval-state.currentKm;let s='ok';if(remain<=0)s='danger';else if(remain<=2500)s='warn';return{s,remain};}function renderInspect(){const sorted=[...state.inspections].sort((a,b)=>{if(a.interval===0)return-1;if(b.interval===0)return 1;return inspectStatus(a).remain-inspectStatus(b).remain;});$('#inspectList').innerHTML=sorted.map(g=>{const{s,remain}=inspectStatus(g);const done=g.items.filter(i=>i.c).length,total=g.items.length;let pill,due;if(s==='daily'){pill='매 운행 전';due='출발 전 확인';}else if(s==='danger'){pill='점검 필요';due=`<b>${km(-remain)} km</b> 초과`;}else if(s==='warn'){pill='점검 임박';due=`다음 점검까지 <b>${km(remain)} km</b>`;}else{pill='여유';due=`다음 점검까지 <b>${km(remain)} km</b>`;}const rows=g.items.map((it,ix)=>`<div class="chk-row ${it.c?'on':''}" onclick="toggleChk('${g.id}',${ix})"><div class="chk-box">${it.c?'✓':''}</div><div class="txt">${it.t}</div><button class="chk-del" onclick="event.stopPropagation();delChk('${g.id}',${ix})">✕</button></div>`).join('');return`<div class="card ins s-${s}"><div class="card-top"><div class="card-name"><span class="ico">${g.icon}</span><h3>${g.name}</h3></div><span class="status-pill">${pill}</span></div><div class="ins-sub">${due} · <span class="mono">${done}/${total}</span> 확인</div><div class="gauge" style="margin-top:9px"><div class="fill" style="width:${total?done/total*100:0}%;background:linear-gradient(90deg,#2fae74,var(--ok))"></div></div><div class="checklist">${rows}</div><div class="card-actions"><button class="done" onclick="completeInspect('${g.id}')">✓ 점검 완료</button><button onclick="addInspectItem('${g.id}')">＋ 항목 추가</button></div></div>`;}).join('');const c=$('#inspectCnt'),n=state.inspections.filter(g=>inspectStatus(g).s==='danger').length;c.textContent=n;c.classList.toggle('zero',n===0);}window.toggleChk=function(gid,ix){const g=state.inspections.find(g=>g.id===gid);g.items[ix].c=!g.items[ix].c;save();renderInspect();};window.delChk=function(gid,ix){const g=state.inspections.find(g=>g.id===gid);g.items.splice(ix,1);save();renderInspect();};window.addInspectItem=function(gid){const g=state.inspections.find(g=>g.id===gid);const t=prompt('점검 항목 추가');if(!t||!t.trim())return;g.items.push({t:t.trim(),c:false});save();renderInspect();};window.completeInspect=function(gid){const g=state.inspections.find(g=>g.id===gid);g.items.forEach(i=>i.c=false);if(g.interval>0){g.lastKm=state.currentKm;toast(`${g.name} 완료 · 다음 점검 시점 갱신`);}else toast('일상점검 체크를 초기화했어요');save();renderInspect();};
function renderLedger(){const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');const monthExp=state.expenses.filter(e=>e.date.slice(0,7)===ym);const monthTotal=monthExp.reduce((s,e)=>s+e.amount,0);const byCat={};monthExp.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const max=cats.length?cats[0][1]:1;let bd=cats.map(([k,v])=>`<div class="bd-row"><div class="k">${catIcon(k)} ${k}</div><div class="bd-bar"><span style="width:${v/max*100}%"></span></div><div class="v">${won(v)}</div></div>`).join('');if(!cats.length)bd=`<div style="font-size:12.5px;color:var(--faint);text-align:center;padding:6px">이번 달 지출이 아직 없어요.</div>`;$('#summaryWrap').innerHTML=`<div class="summary"><div class="mlabel">${now.getMonth()+1}월 지출 합계</div><div class="total">${won(monthTotal)}<small> 원</small></div><div class="breakdown">${bd}</div></div>`;const all=[...state.expenses].sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.id-a.id));if(!all.length){$('#expList').innerHTML=`<div class="empty"><div class="e-ic">🧾</div><div class="e-t">기록이 없습니다</div><div class="e-d">주유·수리·보험비를 추가하면<br>월별·항목별로 자동 정리됩니다.</div></div>`;return;}$('#expList').innerHTML=all.map(e=>`<div class="exp"><div class="cat">${catIcon(e.category)}</div><div class="info"><div class="top"><h4>${e.memo||e.category}</h4><span class="cn">${e.category}</span></div><div class="memo">${e.date}${e.odo?` · ${km(e.odo)}km`:''}</div></div><div class="amt"><div class="n">${won(e.amount)}</div><button class="del" onclick="delExp(${e.id})">삭제</button></div></div>`).join('');}
window.markDone=function(id){const it=state.items.find(i=>i.id===id);openSheet(`<h2>${it.icon} ${it.name} 교체 완료</h2><div class="field mono"><label>교체 시점 주행거리 (km)</label><input id="mdKm" type="number" inputmode="numeric" value="${state.currentKm}"></div><div class="field mono"><label>교체 비용 (원) · 선택</label><input id="mdCost" type="number" inputmode="numeric" placeholder="가계부에 자동 기록 (0이면 미기록)"></div><button class="btn-primary" onclick="confirmDone('${id}')">교체 이력 저장</button><button class="btn-ghost" onclick="closeSheet()">취소</button>`);};window.confirmDone=function(id){const it=state.items.find(i=>i.id===id);const doneKm=+$('#mdKm').value||state.currentKm;const cost=+$('#mdCost').value||0;it.lastKm=doneKm;if(doneKm>state.currentKm)state.currentKm=doneKm;if(cost>0){state.expenses.push({id:Date.now(),date:today(),category:'소모품교체',amount:cost,memo:it.name+' 교체',odo:doneKm});}save();closeSheet();renderAll();toast(cost>0?`${it.name} 교체 기록 + 가계부 저장 완료`:`${it.name} 교체 기록 완료`);};window.editItem=function(id){const it=state.items.find(i=>i.id===id);openSheet(`<h2>${it.icon} ${it.name}</h2><div class="field mono"><label>교체 주기 (km)</label><input id="eiInt" type="number" inputmode="numeric" value="${it.interval}"></div><div class="field mono"><label>직전 교체 주행거리 (km)</label><input id="eiLast" type="number" inputmode="numeric" value="${it.lastKm}"></div><button class="btn-primary" onclick="saveItem('${id}')">저장</button><button class="btn-ghost" onclick="closeSheet()">취소</button>`);};window.saveItem=function(id){const it=state.items.find(i=>i.id===id);it.interval=Math.max(1,+$('#eiInt').value||it.interval);it.lastKm=Math.max(0,+$('#eiLast').value||0);save();closeSheet();renderAll();toast('저장되었습니다');};window.delExp=function(eid){state.expenses=state.expenses.filter(e=>e.id!==eid);save();renderLedger();toast('삭제되었습니다');};
$('#odoDigits').onclick=()=>{openSheet(`<h2>현재 주행거리 입력</h2><div class="field mono"><label>주행거리 (km)</label><input id="odoIn" type="number" inputmode="numeric" value="${state.currentKm}" autofocus></div><button class="btn-primary" onclick="saveOdo()">저장</button><button class="btn-ghost" onclick="closeSheet()">취소</button>`);setTimeout(()=>{const i=$('#odoIn');i.focus();i.select();},60);};window.saveOdo=function(){const v=Math.max(0,+$('#odoIn').value||0);state.currentKm=v;save();closeSheet();renderAll();checkNotify();toast('주행거리 업데이트');};
let pickedCat='주유';function openExpense(){pickedCat='주유';openSheet(`<h2>지출 추가</h2><div class="field"><label>항목</label><div class="chips" id="catChips"></div></div><div class="row2"><div class="field mono"><label>금액 (원)</label><input id="exAmt" type="number" inputmode="numeric" placeholder="0" autofocus></div><div class="field"><label>날짜</label><input id="exDate" type="date" value="${today()}"></div></div><div class="field"><label>메모 · 선택</label><input id="exMemo" type="text" placeholder="예: 셀프주유 / 정기점검"></div><div class="field mono"><label>주행거리 · 선택</label><input id="exOdo" type="number" inputmode="numeric" value="${state.currentKm}"></div><button class="btn-primary" onclick="saveExpense()">지출 저장</button>`);renderChips();setTimeout(()=>$('#exAmt')&&$('#exAmt').focus(),60);}function renderChips(){const wrap=$('#catChips');if(!wrap)return;wrap.innerHTML=state.categories.map(c=>`<button class="chip ${c.name===pickedCat?'sel':''}" onclick="pickCat('${c.name}')">${c.icon} ${c.name}</button>`).join('')+`<button class="chip add" onclick="addCat()">＋ 항목 추가</button>`;}window.pickCat=function(n){pickedCat=n;renderChips();};window.addCat=function(){const name=prompt('새 항목 이름 (예: 세차, 요소수)');if(!name||!name.trim())return;if(state.categories.some(c=>c.name===name.trim())){toast('이미 있는 항목');return;}state.categories.push({name:name.trim(),icon:'🏷️'});pickedCat=name.trim();save();renderChips();};window.saveExpense=function(){const amt=+$('#exAmt').value||0;if(amt<=0){toast('금액을 입력하세요');return;}state.expenses.push({id:Date.now(),date:$('#exDate').value||today(),category:pickedCat,amount:amt,memo:($('#exMemo').value||'').trim(),odo:+$('#exOdo').value||0});save();closeSheet();renderLedger();toast('지출이 저장되었습니다');};function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function openSheet(html){$('#overlay').innerHTML=`<div class="sheet"><div class="grabber"></div>${html}</div>`;$('#overlay').classList.add('show');}window.closeSheet=function(){$('#overlay').classList.remove('show');$('#overlay').innerHTML='';};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet();};
$('#bell').onclick=async()=>{if(!('Notification'in window)){toast('이 브라우저는 알림을 지원하지 않아요');return;}if(state.notifyOn){state.notifyOn=false;save();updateBell();toast('교체 알림을 껐습니다');return;}let perm=Notification.permission;if(perm!=='granted')perm=await Notification.requestPermission();if(perm==='granted'){state.notifyOn=true;save();updateBell();toast('알림 켜짐 · 앱을 열 때 교체 임박 항목을 알려드려요');checkNotify(true);}else{toast('브라우저에서 알림을 차단했어요');}};function updateBell(){$('#bell').classList.toggle('on',state.notifyOn);}function checkNotify(force){if(!state.notifyOn||!('Notification'in window)||Notification.permission!=='granted')return;const due=state.items.map(it=>({it,...statusOf(it)})).filter(x=>x.s!=='ok').sort((a,b)=>a.remain-b.remain);if(!due.length)return;const body=due.map(x=>x.remain<=0?`${x.it.name}: 교체 시기 초과`:`${x.it.name}: ${km(x.remain)}km 남음`).slice(0,4).join('\n');try{new Notification('🔧 뉴파워믹스트럭 소모품 점검',{body:`${due.length}개 항목 교체 임박\n${body}`,tag:'newpower-maint',renotify:false});}catch(e){}}
let tab='maint';document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));$('#view-maint').style.display=tab==='maint'?'':'none';$('#view-inspect').style.display=tab==='inspect'?'':'none';$('#view-ledger').style.display=tab==='ledger'?'':'none';$('#fabText').textContent=tab==='ledger'?'지출 추가':'주행거리 입력';$('#fabIcon').textContent=tab==='ledger'?'＋':'↻';});$('#fab').onclick=()=>{tab==='ledger'?openExpense():$('#odoDigits').click();};function renderAll(){renderOdo();renderMaint();renderInspect();renderLedger();}updateBell();renderAll();$('#fabText').textContent='주행거리 입력';$('#fabIcon').textContent='↻';window.addEventListener('load',()=>checkNotify());
</script>
</body>
</html>
