<script>
const FB={apiKey:'AIzaSyDfAUpbzd_tB6Da-6kRedtuz9G5u7Km7E0',authDomain:'daewang-radio-e1370.firebaseapp.com',databaseURL:'https://daewang-radio-e1370-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'daewang-radio-e1370',storageBucket:'daewang-radio-e1370.firebasestorage.app',appId:'1:56169646168:web:16e5dc67b7acdfa5b1e22d'};if(!firebase.apps.length)firebase.initializeApp(FB);const db=firebase.database();const BASE_KEY='newpower_truck_v2',PROFILE_KEY='daewang_vehicle_profile_v1';let profile=loadProfile(),remoteRef=null;
const ITEMS=[['oil','엔진오일','🛢️',15000],['oilfil','엔진오일 필터','🔩',15000],['grease','구리스 주입(드럼·롤러)','🧴',5000],['hydoil','유압작동유(드럼 구동)','💧',60000],['hydfil','유압 오일필터','🧫',20000],['reducer','드럼 감속기 오일','🥁',40000],['belt','구동벨트','➰',40000],['fuelfil','연료필터','⛽',40000],['air','에어클리너','💨',20000],['coolant','냉각수(부동액)','❄️',40000],['brake','브레이크 라이닝','🛑',60000],['power','파워스티어링 오일','🔧',60000],['tire','타이어','🛞',80000],['mission','미션오일(변속기)','⚙️',100000],['diff','데후오일(차동)','🔗',100000]].map(x=>({id:x[0],name:x[1],icon:x[2],interval:x[3],lastKm:0}));
const INS=[{id:'daily',name:'일상점검',icon:'🧭',interval:0,items:['타이어 공기압 · 마모 · 이물질','엔진오일 · 냉각수 · 워셔액 레벨','브레이크 · 주차브레이크 작동','전조등 · 방향지시등 · 제동등','와이퍼 · 경음기 작동','적재물 결박 · 하부 누유']},{id:'ins2',name:'2만km 정기점검',icon:'🔧',interval:20000,items:['각종 벨트 장력 · 균열','배터리 단자 · 충전 상태','각종 호스 노후 · 누유','에어탱크 수분 배출','하부 볼트 조임 상태']},{id:'ins4',name:'4만km 정기점검',icon:'🛠️',interval:40000,items:['브레이크 라이닝 · 드럼/디스크','조향장치 유격 · 링키지','클러치 유격 · 작동','배기 · 매연 상태','전기 배선 · 등화 전체']},{id:'ins8',name:'8만km 정기점검',icon:'🚚',interval:80000,items:['서스펜션 · 쇼바 · 판스프링','휠 얼라인먼트 · 허브베어링','추진축 · 유니버설 조인트','냉각 계통 전체 점검','프레임 · 마운팅 균열']},{id:'drumDaily',name:'믹서 드럼 일상점검',icon:'🌀',interval:0,items:['유압유 레벨 · 계기 경고등','드럼 정회전 · 역회전 작동','드럼 이상음 · 진동 여부','유압 호스 · 피팅 누유','급수탱크 수량 · 워터펌프 작동','배출 슈트 상태 · 잠금 · 결박','드럼 내부 굳은 콘크리트 세척']},{id:'drumReg',name:'믹서 드럼 정기점검',icon:'🥁',interval:10000,items:['드럼 블레이드 마모 · 굳음','받침롤러 유격 · 마모','후방 베어링 유격 · 소음 · 구리스','드럼 구동벨트 장력 · 균열','PTO 작동 · 소음','감속기 누유 · 소음','드럼 마운팅 볼트 조임']}].map(g=>({...g,lastKm:0,items:g.items.map(t=>({t,c:false}))}));const CATS=[{name:'소모품교체',icon:'🔧'},{name:'주유',icon:'⛽'},{name:'수리',icon:'🛠️'},{name:'보험',icon:'📄'},{name:'통행료',icon:'🛣️'},{name:'기타',icon:'📌'}];
function fresh(){return{currentKm:0,items:JSON.parse(JSON.stringify(ITEMS)),expenses:[],categories:CATS.slice(),inspections:JSON.parse(JSON.stringify(INS)),notifyKm:1500,notifyOn:false}}function key(){return BASE_KEY+'_'+(profile?.key||'none')}function loadProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'null')}catch(e){return null}}function makeKey(n,v){return encodeURIComponent((n+'_'+v).toLowerCase()).replace(/[.#$\[\]\/]/g,'_')}function norm(s){if(!s||!s.items)return fresh();s.expenses=s.expenses||[];s.categories=s.categories||CATS.slice();s.inspections=s.inspections||JSON.parse(JSON.stringify(INS));s.notifyKm=s.notifyKm??1500;s.notifyOn=s.notifyOn??false;ITEMS.forEach(d=>{if(!s.items.some(i=>i.id===d.id))s.items.push(JSON.parse(JSON.stringify(d)))});INS.forEach(d=>{if(!s.inspections.some(i=>i.id===d.id))s.inspections.push(JSON.parse(JSON.stringify(d)))});return s}function load(){try{return norm(JSON.parse(localStorage.getItem(key())||'null'))}catch(e){return fresh()}}let state=load();const $=s=>document.querySelector(s),km=n=>new Intl.NumberFormat('ko-KR').format(Math.round(n)),won=km;let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}function save(){localStorage.setItem(key(),JSON.stringify(state));if(profile&&remoteRef)remoteRef.update({name:profile.name,vehicleNo:profile.vno,state,updatedAt:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{})}
function profileUI(){if(profile){$('#profileName').textContent=profile.name+' 기사';$('#profileSub').textContent='차량 '+profile.vno+' · Firebase 개인 저장'}else{$('#profileName').textContent='기사 선택 필요';$('#profileSub').textContent='개인 차량 기록을 선택하세요'}}function connect(){if(remoteRef)remoteRef.off();profileUI();if(!profile)return;remoteRef=db.ref('vehicleManagement/'+profile.key);remoteRef.on('value',s=>{const v=s.val();if(v?.state){state=norm(v.state);localStorage.setItem(key(),JSON.stringify(state));renderAll()}else remoteRef.set({name:profile.name,vehicleNo:profile.vno,state,updatedAt:firebase.database.ServerValue.TIMESTAMP})});db.ref('.info/connected').on('value',s=>$('#syncDot').classList.toggle('on',s.val()===true))}
function sheet(h){$('#overlay').innerHTML='<div class="sheet">'+h+'</div>';$('#overlay').classList.add('show')}window.closeSheet=()=>{$('#overlay').classList.remove('show');$('#overlay').innerHTML=''};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet()};window.changeProfile=()=>sheet(`<h2>👤 개인 기사 선택</h2><div class="field"><label>기사 성명</label><input id="pfName" value="${profile?.name||''}" placeholder="예: 김경진"></div><div class="field"><label>차량 번호</label><input id="pfVno" value="${profile?.vno||''}" inputmode="numeric" placeholder="예: 5029"></div><div style="font-size:12px;color:var(--muted);line-height:1.6">같은 성명과 차량번호를 입력하면 다른 휴대폰에서도 기존 기록을 불러옵니다.</div><button class="btn-primary" onclick="saveProfile()">이 기사 기록 열기</button>${profile?'<button class="btn-ghost" onclick="closeSheet()">취소</button>':''}`);window.saveProfile=()=>{const n=$('#pfName').value.trim(),v=$('#pfVno').value.trim();if(!n||!v)return toast('성명과 차량번호를 입력하세요');profile={name:n,vno:v,key:makeKey(n,v)};localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));state=load();closeSheet();profileUI();renderAll();connect();toast(n+' 기사 기록을 열었습니다')};
function status(i){const remain=i.lastKm+i.interval-state.currentKm,ratio=Math.max(0,Math.min(1,(state.currentKm-i.lastKm)/i.interval));return{remain,ratio,s:remain<=0?'danger':remain<=state.notifyKm?'warn':'ok'}}function renderOdo(){$('#odoDigits').innerHTML=km(state.currentKm).split('').map(c=>c===','?'<div class="digit sep">,</div>':`<div class="digit">${c}</div>`).join('')}function renderMaint(){const bad=state.items.filter(i=>status(i).s==='danger'),warn=state.items.filter(i=>status(i).s==='warn');$('#bannerWrap').innerHTML=bad.length?`<div class="banner red"><div>⚠️</div><div><div class="t">교체 시기 초과 ${bad.length}건</div><div class="d">${bad.map(x=>x.name).join(', ')}</div></div></div>`:warn.length?`<div class="banner amber"><div>🔔</div><div><div class="t">교체 임박 ${warn.length}건</div><div class="d">${warn.map(x=>x.name).join(', ')}</div></div></div>`:`<div class="banner green"><div>✓</div><div><div class="t">모든 소모품 정상</div><div class="d">현재 교체 임박 항목이 없습니다.</div></div></div>`;$('#maintList').innerHTML=[...state.items].sort((a,b)=>status(a).remain-status(b).remain).map(i=>{const x=status(i),pill=x.s==='danger'?'교체 필요':x.s==='warn'?'교체 임박':'양호';return`<div class="card s-${x.s}"><div class="card-top"><div class="card-name"><span>${i.icon}</span><h3>${i.name}</h3></div><span class="status-pill">${pill}</span></div><div class="gauge"><div class="fill" style="width:${x.ratio*100}%"></div></div><div class="card-meta"><div class="remain">${x.remain<=0?`<b>${km(-x.remain)} km</b> 초과`:`다음 교체까지 <b>${km(x.remain)} km</b>`}</div><div class="sub">주기 ${km(i.interval)}km<br>${i.lastKm?`직전 ${km(i.lastKm)}km`:'이력 없음'}</div></div><div class="card-actions"><button class="done" onclick="doneItem('${i.id}')">✓ 교체 완료</button><button onclick="editItem('${i.id}')">주기·이력 수정</button></div></div>`}).join('');const c=state.items.filter(i=>status(i).s!=='ok').length;$('#alertCnt').textContent=c;$('#alertCnt').classList.toggle('zero',!c)}
function ist(g){if(!g.interval)return{s:'daily',remain:0};const r=g.lastKm+g.interval-state.currentKm;return{s:r<=0?'danger':r<=2500?'warn':'ok',remain:r}}function renderInspect(){$('#inspectList').innerHTML=state.inspections.map(g=>{const x=ist(g),d=g.items.filter(i=>i.c).length;return`<div class="card s-${x.s}"><div class="card-top"><div class="card-name"><span>${g.icon}</span><h3>${g.name}</h3></div><span class="status-pill">${!g.interval?'매 운행 전':x.s==='danger'?'점검 필요':x.s==='warn'?'점검 임박':'여유'}</span></div><div class="ins-sub">${!g.interval?'출발 전 확인':`다음 점검까지 ${km(Math.max(0,x.remain))}km`} · ${d}/${g.items.length} 확인</div><div class="checklist">${g.items.map((i,k)=>`<div class="chk-row ${i.c?'on':''}" onclick="toggleChk('${g.id}',${k})"><div class="chk-box">${i.c?'✓':''}</div><div class="txt">${i.t}</div><button class="chk-del" onclick="event.stopPropagation();delChk('${g.id}',${k})">✕</button></div>`).join('')}</div><div class="card-actions"><button class="done" onclick="completeInspect('${g.id}')">✓ 점검 완료</button><button onclick="addInspect('${g.id}')">＋ 항목 추가</button></div></div>`}).join('');const c=state.inspections.filter(g=>ist(g).s==='danger').length;$('#inspectCnt').textContent=c;$('#inspectCnt').classList.toggle('zero',!c)}window.toggleChk=(id,k)=>{const g=state.inspections.find(x=>x.id===id);g.items[k].c=!g.items[k].c;save();renderInspect()};window.delChk=(id,k)=>{state.inspections.find(x=>x.id===id).items.splice(k,1);save();renderInspect()};window.addInspect=id=>{const t=prompt('점검 항목 추가');if(t?.trim()){state.inspections.find(x=>x.id===id).items.push({t:t.trim(),c:false});save();renderInspect()}};window.completeInspect=id=>{const g=state.inspections.find(x=>x.id===id);g.items.forEach(i=>i.c=false);if(g.interval)g.lastKm=state.currentKm;save();renderInspect();toast('점검 기록 저장 완료')};
function catIcon(n){return state.categories.find(c=>c.name===n)?.icon||'📌'}function renderLedger(){const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),m=state.expenses.filter(e=>e.date.slice(0,7)===ym),total=m.reduce((a,b)=>a+b.amount,0),bc={};m.forEach(e=>bc[e.category]=(bc[e.category]||0)+e.amount);const cats=Object.entries(bc),max=Math.max(1,...cats.map(x=>x[1]));$('#summaryWrap').innerHTML=`<div class="summary"><div class="mlabel">${now.getMonth()+1}월 지출 합계</div><div class="total">${won(total)} <small>원</small></div><div class="breakdown">${cats.map(([k,v])=>`<div class="bd-row"><div class="k">${catIcon(k)} ${k}</div><div class="bd-bar"><span style="width:${v/max*100}%"></span></div><div class="v">${won(v)}</div></div>`).join('')}</div></div>`;$('#expList').innerHTML=state.expenses.length?[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="exp"><div class="cat">${catIcon(e.category)}</div><div class="info"><div class="top"><b>${e.memo||e.category}</b></div><div class="memo">${e.date}${e.odo?' · '+km(e.odo)+'km':''}</div></div><div class="amt"><div class="n">${won(e.amount)}</div><button class="del" onclick="delExp(${e.id})">삭제</button></div></div>`).join(''):'<div class="empty">기록이 없습니다.</div>'}window.delExp=id=>{state.expenses=state.expenses.filter(e=>e.id!==id);save();renderLedger()};
window.doneItem=id=>{const i=state.items.find(x=>x.id===id);sheet(`<h2>${i.icon} ${i.name} 교체 완료</h2><div class="field"><label>교체 주행거리</label><input id="dk" type="number" value="${state.currentKm}"></div><div class="field"><label>교체 비용 · 선택</label><input id="dc" type="number" placeholder="0"></div><button class="btn-primary" onclick="saveDone('${id}')">저장</button>`)};window.saveDone=id=>{const i=state.items.find(x=>x.id===id),k=+$('#dk').value||state.currentKm,c=+$('#dc').value||0;i.lastKm=k;if(k>state.currentKm)state.currentKm=k;if(c>0)state.expenses.push({id:Date.now(),date:today(),category:'소모품교체',amount:c,memo:i.name+' 교체',odo:k});save();closeSheet();renderAll()};window.editItem=id=>{const i=state.items.find(x=>x.id===id);sheet(`<h2>${i.icon} ${i.name}</h2><div class="field"><label>교체 주기 km</label><input id="ii" type="number" value="${i.interval}"></div><div class="field"><label>직전 교체 km</label><input id="il" type="number" value="${i.lastKm}"></div><button class="btn-primary" onclick="saveItem('${id}')">저장</button>`)};window.saveItem=id=>{const i=state.items.find(x=>x.id===id);i.interval=Math.max(1,+$('#ii').value||i.interval);i.lastKm=Math.max(0,+$('#il').value||0);save();closeSheet();renderAll()};
$('#odoDigits').onclick=()=>sheet(`<h2>현재 주행거리 입력</h2><div class="field"><label>주행거리 km</label><input id="od" type="number" value="${state.currentKm}"></div><button class="btn-primary" onclick="saveOdo()">저장</button>`);window.saveOdo=()=>{state.currentKm=Math.max(0,+$('#od').value||0);save();closeSheet();renderAll();toast('주행거리 저장 완료')};let picked='주유';function expense(){picked='주유';sheet(`<h2>지출 추가</h2><div class="field"><label>항목</label><div class="chips" id="chips"></div></div><div class="field"><label>금액</label><input id="ea" type="number"></div><div class="field"><label>날짜</label><input id="ed" type="date" value="${today()}"></div><div class="field"><label>메모</label><input id="em"></div><button class="btn-primary" onclick="saveExp()">지출 저장</button>`);chips()}function chips(){$('#chips').innerHTML=state.categories.map(c=>`<button class="chip ${c.name===picked?'sel':''}" onclick="picked='${c.name}';chips()">${c.icon} ${c.name}</button>`).join('')}window.saveExp=()=>{const a=+$('#ea').value||0;if(a<=0)return toast('금액을 입력하세요');state.expenses.push({id:Date.now(),date:$('#ed').value||today(),category:picked,amount:a,memo:$('#em').value.trim(),odo:state.currentKm});save();closeSheet();renderLedger()};function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('#bell').onclick=async()=>{if(!('Notification'in window))return toast('알림 미지원 브라우저입니다');let p=Notification.permission;if(p!=='granted')p=await Notification.requestPermission();state.notifyOn=p==='granted';save();$('#bell').classList.toggle('on',state.notifyOn);toast(state.notifyOn?'교체 알림 켜짐':'알림 권한이 필요합니다')};let tab='maint';document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));$('#view-maint').style.display=tab==='maint'?'':'none';$('#view-inspect').style.display=tab==='inspect'?'':'none';$('#view-ledger').style.display=tab==='ledger'?'':'none';$('#fabText').textContent=tab==='ledger'?'지출 추가':'주행거리 입력';$('#fabIcon').textContent=tab==='ledger'?'＋':'↻'});$('#fab').onclick=()=>tab==='ledger'?expense():$('#odoDigits').click();function renderAll(){renderOdo();renderMaint();renderInspect();renderLedger()}profileUI();renderAll();connect();$('#bell').classList.toggle('on',state.notifyOn);window.addEventListener('load',()=>{if(!profile)setTimeout(changeProfile,200);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script></body></html>
