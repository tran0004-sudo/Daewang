<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c1272d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="대왕레미콘 무전"><link rel="icon" href="icons/app-icon.png"><title>대왕레미콘 무전</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef0ee;font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e;padding-bottom:30px}header{background:#c1272d;color:#fff;padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}header button{background:#fff2;color:#fff;border:1px solid #fff5;border-radius:9px;padding:8px 10px}header h1{font-size:20px;margin:0}.wrap{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dde1e5;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 5px 14px #0000000b}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button,.btn{border:0;border-radius:10px;padding:13px;font-weight:700;font-size:15px}.tabs button{background:#eceff2;color:#59616c}.tabs .on,.primary{background:#c1272d!important;color:#fff!important}.ghost{background:#eef0f3;color:#626b76}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#6c7480;font-weight:700;margin-bottom:6px}select{width:100%;padding:13px;border:1px solid #d5dae0;border-radius:10px;background:#f7f8f9;font-size:16px}.list{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.person{display:flex;align-items:center;gap:8px;background:#f6f7f8;border:1px solid #e1e4e7;padding:9px;border-radius:10px;font-size:13px}.person input{width:20px;height:20px}.status{padding:12px;border-radius:10px;background:#edf5ef;color:#176b3b;text-align:center;font-weight:700;margin:12px 0}.members{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{background:#eef3f7;border-radius:18px;padding:7px 10px;font-size:12px;font-weight:700}.ptt{display:block;width:190px;height:190px;border-radius:50%;border:0;background:#c1272d;color:#fff;font-size:25px;font-weight:900;margin:22px auto;touch-action:none;box-shadow:0 10px 30px #c1272d44}.ptt.on{background:#16864a}.small{font-size:12px;color:#737c87;line-height:1.55}.hide{display:none!important}.full{width:100%;margin-top:8px}</style></head><body><header><button onclick="location.href='./'">← 홈</button><h1>📻 대왕레미콘 무전</h1></header><div class="wrap"><div class="card"><div class="tabs"><button id="tabDriver" class="on">기사</button><button id="tabAdmin">관리자</button></div></div><section id="driverView"><div class="card"><b>내 기사 설정</b><div class="field"><label>이 휴대폰의 기사</label><select id="self"></select></div><button class="btn primary full" id="saveSelf">내 기사 저장</button><div class="small" style="margin-top:8px">최초 1회만 저장하면 됩니다. 관리자가 초대하면 같은 무전방으로 연결됩니다.</div></div><div class="card"><div id="inviteStatus" class="status">현재 무전방 없음</div><button id="joinBtn" class="btn primary full hide">무전방 참가</button><div id="live" class="hide"><div id="connStatus" class="status">연결 준비 중…</div><div id="members" class="members"></div><button id="ptt" class="ptt">누르고<br>말하기</button><button id="leaveBtn" class="btn ghost full">나가기</button></div></div></section><section id="adminView" class="hide"><div class="card"><b>무전할 기사 선택</b><div id="adminList" class="list"></div><button id="startBtn" class="btn primary full">선택 기사로 무전방 시작</button><button id="endBtn" class="btn ghost full">현재 무전방 종료</button></div><div class="card"><div id="adminStatus" class="status">현재 무전방 없음</div><div class="small">관리자는 방을 만들고 종료합니다. 직접 말하려면 기사 탭에서 본인 이름을 저장한 뒤 참가하세요.</div></div></section></div><script>
const FIREBASE={apiKey:'AIzaSyDfAUpbzd_tB6Da-6kRedtuz9G5u7Km7E0',databaseURL:'https://daewang-radio-e1370-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'daewang-radio-e1370',authDomain:'daewang-radio-e1370.firebaseapp.com',appId:'1:56169646168:web:16e5dc67b7acdfa5b1e22d'};
const DRIVERS=[[1,'김경진','5029'],[1,'박재영','5669'],[1,'김상종','7352'],[1,'강경돈','5143'],[1,'박원호','5389'],[2,'정갑천','7348'],[2,'정양환','7296'],[2,'신승수','6461'],[2,'손석목','8728'],[2,'유재수','8437'],[3,'황영호','5596'],[3,'이경구','5361'],[3,'이종학','5880'],[3,'최영득','6980'],[3,'함영철','7303'],[4,'김도호','5384'],[4,'박치화','6690'],[4,'류병곤','5472'],[4,'신해연','5579'],[4,'장병윤','7317'],[5,'박재영','5212'],[5,'이상복','7698'],[5,'조남욱','7569'],[5,'김재환','7701'],[5,'최용규','5606'],[6,'이명신','5280'],[6,'강성호','5210'],[6,'염규삼','7318'],[6,'정희수','7102'],[6,'전종현','5586']].map((x,i)=>({id:i+1,team:x[0],name:x[1],vno:x[2]}));
const SELF='daewang_radio_self_driver_v3',ROOM='daewang-main';firebase.initializeApp(FIREBASE);const db=firebase.database(),root=db.ref(`radio/${ROOM}`);let session=null,me=null,stream=null,peers=new Map(),audios=new Map(),offs=[];const $=s=>document.querySelector(s);$('#self').innerHTML=DRIVERS.map(d=>`<option value="${d.id}">${d.name} · ${d.vno} (${d.team}조)</option>`).join('');$('#adminList').innerHTML=DRIVERS.map(d=>`<label class="person"><input type="checkbox" value="${d.id}"><span>${d.name}<br><small>${d.vno} · ${d.team}조</small></span></label>`).join('');const saved=+(localStorage.getItem(SELF)||0);if(saved)$('#self').value=saved;
function tab(admin){$('#driverView').classList.toggle('hide',admin);$('#adminView').classList.toggle('hide',!admin);$('#tabAdmin').classList.toggle('on',admin);$('#tabDriver').classList.toggle('on',!admin)}$('#tabDriver').onclick=()=>tab(false);$('#tabAdmin').onclick=()=>tab(true);$('#saveSelf').onclick=()=>{localStorage.setItem(SELF,$('#self').value);renderSession();alert('내 기사로 저장했습니다.')};
function selectedMap(){const o={};document.querySelectorAll('#adminList input:checked').forEach(x=>{const d=DRIVERS.find(d=>d.id==x.value);o[d.id]=d});return o}$('#startBtn').onclick=async()=>{const selected=selectedMap();if(!Object.keys(selected).length)return alert('무전할 기사를 선택하세요.');await Promise.all([root.child('members').remove(),root.child('offers').remove(),root.child('answers').remove(),root.child('cand').remove()]);await root.child('session').set({active:true,sessionId:'s_'+Date.now().toString(36),startedAt:firebase.database.ServerValue.TIMESTAMP,selected});};$('#endBtn').onclick=async()=>{await root.child('session').set({active:false,endedAt:firebase.database.ServerValue.TIMESTAMP,selected:{}});await Promise.all([root.child('members').remove(),root.child('offers').remove(),root.child('answers').remove(),root.child('cand').remove()]);leave();};
root.child('session').on('value',s=>{session=s.val();renderSession();if((!session||!session.active)&&me)leave()});function renderSession(){const live=session&&session.active,arr=live?Object.values(session.selected||{}):[];$('#adminStatus').textContent=live?`현재 무전 대상 ${arr.length}명 · ${arr.map(x=>x.name).join(', ')}`:'현재 무전방 없음';const id=+(localStorage.getItem(SELF)||0),inv=live&&session.selected&&session.selected[id];$('#inviteStatus').textContent=inv?`✅ ${inv.name}님이 무전 대상입니다.`:(live?'현재 무전 대상이 아닙니다.':'현재 무전방 없음');$('#joinBtn').classList.toggle('hide',!inv||!!me)}
async function getPeer(id,offer){if(peers.has(id))return peers.get(id);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(id,pc);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)root.child(`cand/${id}/${me}`).push(e.candidate.toJSON())};pc.ontrack=e=>{let a=audios.get(id);if(!a){a=document.createElement('audio');a.autoplay=true;a.playsInline=true;document.body.appendChild(a);audios.set(id,a)}a.srcObject=e.streams[0]};if(offer){const o=await pc.createOffer();await pc.setLocalDescription(o);await root.child(`offers/${id}/${me}`).set({type:o.type,sdp:o.sdp})}return pc}
async function join(){const id=+(localStorage.getItem(SELF)||0),d=DRIVERS.find(x=>x.id===id);if(!d)return alert('먼저 내 기사를 저장하세요.');if(!(session&&session.active&&session.selected&&session.selected[id]))return alert('현재 초대 대상이 아닙니다.');try{me='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});stream.getAudioTracks().forEach(t=>t.enabled=false);$('#joinBtn').classList.add('hide');$('#live').classList.remove('hide');const m=root.child('members');await m.child(me).set({name:d.name,vno:d.vno});m.child(me).onDisconnect().remove();let cb=s=>{const o=s.val()||{};$('#members').innerHTML=Object.values(o).map(x=>`<span class="chip">🔊 ${x.name}</span>`).join('');$('#connStatus').textContent=`연결 인원 ${Object.keys(o).length}명`};m.on('value',cb);offs.push([m,'value',cb]);cb=s=>{if(s.key!==me&&me<s.key)getPeer(s.key,true)};m.on('child_added',cb);offs.push([m,'child_added',cb]);let r=root.child(`offers/${me}`);cb=async s=>{const pc=await getPeer(s.key,false);await pc.setRemoteDescription(s.val());const a=await pc.createAnswer();await pc.setLocalDescription(a);await root.child(`answers/${s.key}/${me}`).set({type:a.type,sdp:a.sdp})};r.on('child_added',cb);offs.push([r,'child_added',cb]);r=root.child(`answers/${me}`);cb=async s=>{const pc=peers.get(s.key);if(pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(s.val())};r.on('child_added',cb);offs.push([r,'child_added',cb]);r=root.child(`cand/${me}`);cb=s=>{const src=s.key,c=async x=>{const pc=await getPeer(src,false);try{await pc.addIceCandidate(x.val())}catch(e){}};s.ref.on('child_added',c);offs.push([s.ref,'child_added',c])};r.on('child_added',cb);offs.push([r,'child_added',cb]);}catch(e){me=null;alert('마이크 권한을 허용한 뒤 다시 시도하세요.')}}$('#joinBtn').onclick=join;
function leave(){if(db&&me)root.child(`members/${me}`).remove();offs.forEach(x=>{try{x[0].off(x[1],x[2])}catch(e){}});offs=[];peers.forEach(p=>p.close());peers.clear();audios.forEach(a=>a.remove());audios.clear();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;me=null;$('#live').classList.add('hide');renderSession()}$('#leaveBtn').onclick=leave;
const p=$('#ptt');function tx(v){if(!stream)return;stream.getAudioTracks().forEach(t=>t.enabled=v);p.classList.toggle('on',v);p.innerHTML=v?'송신 중…':'누르고<br>말하기'};['pointerdown','touchstart'].forEach(ev=>p.addEventListener(ev,e=>{e.preventDefault();tx(true)},{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>p.addEventListener(ev,e=>{e.preventDefault();tx(false)},{passive:false}));renderSession();
</script></body></html>
