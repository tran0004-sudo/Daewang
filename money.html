<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c1272d"><title>대왕레미콘 자금관리</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0ee;font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e;padding-bottom:86px}button,input,select{font:inherit}header{background:#c1272d;color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20}.title{font-size:21px;font-weight:800}.back{color:#fff;text-decoration:none;font-size:14px}.wrap{padding:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum{background:#fff;border:1px solid #dde1e5;border-radius:12px;padding:12px 8px;text-align:center}.sum small{display:block;color:#747d88;font-size:11px;margin-bottom:4px}.sum b{font-size:14px}.income b{color:#16774a}.expense b{color:#c1272d}.balance b{color:#27364a}.calbox{background:#fff;border:1px solid #dde1e5;border-radius:15px;padding:12px;box-shadow:0 4px 12px #0000000a}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calhead button{border:0;background:#f1f3f5;border-radius:9px;padding:8px 12px}.calhead strong{font-size:18px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-size:11px;color:#7a828d;padding:7px 0}.day{min-height:67px;border:1px solid #eef0f2;padding:5px;background:#fff;text-align:left;position:relative}.day.empty{background:#f8f9fa}.day.today{outline:2px solid #c1272d;outline-offset:-2px}.day.selected{background:#fff5f5}.num{font-size:12px;font-weight:700}.moneydot{display:block;font-size:9px;line-height:1.25;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.moneydot.in{color:#16774a}.moneydot.out{color:#c1272d}.panel{background:#fff;border:1px solid #dde1e5;border-radius:15px;padding:14px;margin-top:12px}.panel h3{margin:0 0 10px;font-size:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields input,.fields select,.memo{width:100%;border:1px solid #d8dde3;border-radius:10px;padding:11px;background:#f8f9fa}.memo{margin-top:8px}.save{width:100%;border:0;background:#c1272d;color:#fff;padding:13px;border-radius:10px;font-weight:800;margin-top:9px}.list{margin-top:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #edf0f2;padding:10px 0}.item:first-child{border-top:0}.itemmain{min-width:0}.itemmain b{display:block;font-size:14px}.itemmain small{display:block;color:#737b85;margin-top:3px}.amt{font-weight:800;white-space:nowrap}.amt.in{color:#16774a}.amt.out{color:#c1272d}.del{border:0;background:#f1f3f5;border-radius:8px;padding:6px 8px;font-size:11px}.emptymsg{color:#7a828d;font-size:13px;padding:8px 0}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #d8dce2;display:flex;overflow-x:auto}.nav a{text-decoration:none;min-width:70px;flex:1;color:#707985;font-size:10px;padding:7px 2px;text-align:center}.nav b{display:block;font-size:21px;margin-bottom:2px}.nav .on{color:#c1272d}</style></head><body><header><div class="title">💰 자금관리</div><a class="back" href="index.html">홈</a></header><main class="wrap"><section class="summary"><div class="sum income"><small>이번달 수입</small><b id="sin">0원</b></div><div class="sum expense"><small>이번달 지출</small><b id="sout">0원</b></div><div class="sum balance"><small>잔액</small><b id="sbal">0원</b></div></section><section class="calbox"><div class="calhead"><button id="prev">◀</button><strong id="ym"></strong><button id="next">▶</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div></section><section class="panel"><h3 id="selTitle">내역 입력</h3><div class="fields"><select id="type"><option value="in">수입</option><option value="out">지출</option></select><input id="amount" type="number" inputmode="numeric" placeholder="금액"></div><div class="fields" style="margin-top:8px"><select id="cat"><option>회비</option><option>운영비</option><option>식대</option><option>유류비</option><option>수리비</option><option>경조사</option><option>기타</option></select><input id="date" type="date"></div><input class="memo" id="memo" placeholder="내용 / 메모"><button class="save" id="save">저장</button><div class="list" id="list"></div></section></main><nav class="nav"><a href="index.html"><b>🏠</b>홈</a><a href="notice.html"><b>📢</b>공지</a><a href="volume.html"><b>🚚</b>물량</a><a href="radio.html"><b>📻</b>무전</a><a href="dashboard.html"><b>📊</b>현황</a><a class="on" href="money.html"><b>💰</b>자금</a><a href="rules.html"><b>📘</b>회칙</a></nav><script>const KEY='daewang_fund_ledger_v1';let rows=JSON.parse(localStorage.getItem(KEY)||'[]');const now=new Date();let y=now.getFullYear(),m=now.getMonth(),selected=fmt(now);const $=s=>document.querySelector(s);function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function won(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}function saveRows(){localStorage.setItem(KEY,JSON.stringify(rows))}function monthRows(){const p=y+'-'+String(m+1).padStart(2,'0');return rows.filter(r=>r.date.startsWith(p))}function renderSummary(){const a=monthRows(),inc=a.filter(r=>r.type==='in').reduce((s,r)=>s+r.amount,0),out=a.filter(r=>r.type==='out').reduce((s,r)=>s+r.amount,0);$('#sin').textContent=won(inc);$('#sout').textContent=won(out);$('#sbal').textContent=won(inc-out)}function renderCal(){const first=new Date(y,m,1),last=new Date(y,m+1,0),start=first.getDay();$('#ym').textContent=`${y}년 ${m+1}월`;let h='';for(let i=0;i<start;i++)h+='<button class="day empty" disabled></button>';for(let d=1;d<=last.getDate();d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),dayRows=rows.filter(r=>r.date===ds),inc=dayRows.filter(r=>r.type==='in').reduce((s,r)=>s+r.amount,0),out=dayRows.filter(r=>r.type==='out').reduce((s,r)=>s+r.amount,0),cl='day'+(ds===fmt(now)?' today':'')+(ds===selected?' selected':'');h+=`<button class="${cl}" data-date="${ds}"><span class="num">${d}</span>${inc?`<span class="moneydot in">+${won(inc)}</span>`:''}${out?`<span class="moneydot out">-${won(out)}</span>`:''}</button>`}$('#days').innerHTML=h;$('#days').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;$('#date').value=selected;renderCal();renderList()});renderSummary()}function renderList(){const a=rows.filter(r=>r.date===selected).sort((a,b)=>b.id-a.id);$('#selTitle').textContent=selected+' 내역';$('#date').value=selected;$('#list').innerHTML=a.length?a.map(r=>`<div class="item"><div class="itemmain"><b>${r.cat} · ${r.memo||'메모 없음'}</b><small>${r.type==='in'?'수입':'지출'}</small></div><div class="amt ${r.type}">${r.type==='in'?'+':'-'}${won(r.amount)}</div><button class="del" data-id="${r.id}">삭제</button></div>`).join(''):'<div class="emptymsg">등록된 내역이 없습니다.</div>';$('#list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{rows=rows.filter(r=>r.id!=b.dataset.id);saveRows();renderAll()})}function renderAll(){renderCal();renderList()}$('#prev').onclick=()=>{m--;if(m<0){m=11;y--}selected=y+'-'+String(m+1).padStart(2,'0')+'-01';renderAll()};$('#next').onclick=()=>{m++;if(m>11){m=0;y++}selected=y+'-'+String(m+1).padStart(2,'0')+'-01';renderAll()};$('#save').onclick=()=>{const amount=Math.max(0,Number($('#amount').value)||0),date=$('#date').value||selected;if(!amount)return alert('금액을 입력하세요.');rows.push({id:Date.now(),date,type:$('#type').value,cat:$('#cat').value,amount,memo:$('#memo').value.trim()});saveRows();selected=date;const d=new Date(date+'T00:00:00');y=d.getFullYear();m=d.getMonth();$('#amount').value='';$('#memo').value='';renderAll()};renderAll();</script></body></html>
