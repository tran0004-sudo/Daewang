<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c1272d"><title>대왕레미콘 자금관리</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef0ee;font-family:Arial,'Noto Sans KR',sans-serif;color:#20252e;padding-bottom:86px}button,input,select{font:inherit}header{background:#c1272d;color:#fff;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:20}.title{font-size:21px;font-weight:800}.headBtns{display:flex;gap:7px}.headBtn,.back{color:#fff;text-decoration:none;font-size:12px;border:1px solid #ffffff66;background:#ffffff18;border-radius:8px;padding:7px 9px}.wrap{padding:12px}.status{background:#fff;border:1px solid #dde1e5;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:12px;color:#68717c;display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.dot.on{background:#16a05d}.dot.off{background:#d33}.role{margin-left:auto;font-weight:800}.role.admin{color:#c1272d}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum{background:#fff;border:1px solid #dde1e5;border-radius:12px;padding:12px 8px;text-align:center}.sum small{display:block;color:#747d88;font-size:11px;margin-bottom:4px}.sum b{font-size:14px}.income b{color:#16774a}.expense b{color:#c1272d}.datebar{background:#fff;border:1px solid #dde1e5;border-radius:15px;padding:12px;box-shadow:0 4px 12px #0000000a;margin-bottom:12px}.datebar h3{margin:0 0 10px;font-size:16px}.dateRow{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}.dateRow button{border:0;background:#f1f3f5;border-radius:10px;padding:12px 0;font-weight:800}.dateRow input{width:100%;border:1px solid #d8dde3;border-radius:10px;padding:11px;background:#fff;font-weight:700}.todayBtn{width:100%;border:0;background:#fff3f3;color:#c1272d;border-radius:10px;padding:10px;margin-top:8px;font-weight:800}.daySummary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.daySummary div{background:#f8f9fa;border-radius:10px;padding:10px;text-align:center}.daySummary small{display:block;color:#737b85;font-size:11px}.daySummary b{font-size:14px}.panel{background:#fff;border:1px solid #dde1e5;border-radius:15px;padding:14px;margin-top:12px}.panel h3{margin:0 0 10px;font-size:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields input,.fields select,.memo,.loginBox input{width:100%;border:1px solid #d8dde3;border-radius:10px;padding:11px;background:#f8f9fa}.memo{margin-top:8px}.save{width:100%;border:0;background:#c1272d;color:#fff;padding:13px;border-radius:10px;font-weight:800;margin-top:9px}.list{margin-top:4px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #edf0f2;padding:12px 0}.item:first-child{border-top:0}.itemmain{min-width:0;flex:1}.itemmain b{display:block;font-size:14px}.itemmain small{display:block;color:#737b85;margin-top:3px}.amt{font-weight:800;white-space:nowrap}.amt.in{color:#16774a}.amt.out{color:#c1272d}.del{border:0;background:#f1f3f5;border-radius:8px;padding:6px 8px;font-size:11px}.emptymsg{color:#7a828d;font-size:13px;padding:10px 0}.readonly{background:#fff7e6;border:1px solid #f0cf8f;border-radius:10px;padding:10px 12px;font-size:12px;color:#75510a}.adminOnly{display:none}.adminOnly.on{display:block}.loginBox{display:none;background:#fff;border:1px solid #dde1e5;border-radius:15px;padding:14px;margin-bottom:12px}.loginBox.on{display:block}.loginBox h3{margin:0 0 10px}.loginBox input+input{margin-top:8px}.loginActions{display:flex;gap:8px;margin-top:9px}.loginActions button{flex:1;border:0;border-radius:9px;padding:11px;font-weight:800}.login{background:#c1272d;color:#fff}.logout{background:#eceff2;color:#333}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #d8dce2;display:flex;overflow-x:auto}.nav a{text-decoration:none;min-width:70px;flex:1;color:#707985;font-size:10px;padding:7px 2px;text-align:center}.nav b{display:block;font-size:21px;margin-bottom:2px}.nav .on{color:#c1272d}</style></head><body><header><div class="title">💰 자금관리</div><div class="headBtns"><button class="headBtn" id="adminBtn">관리자</button><a class="back" href="index.html">홈</a></div></header><main class="wrap"><div class="status"><span class="dot" id="dot"></span><span id="syncText">공동장부 연결 중…</span><span class="role" id="roleText">회원 조회모드</span></div><section class="loginBox" id="loginBox"><h3>관리자 로그인</h3><input id="email" type="email" autocomplete="username" placeholder="관리자 이메일"><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="loginActions"><button class="login" id="loginBtn">로그인</button><button class="logout" id="logoutBtn">로그아웃</button></div></section><section class="summary"><div class="sum income"><small>선택월 수입</small><b id="sin">0원</b></div><div class="sum expense"><small>선택월 지출</small><b id="sout">0원</b></div><div class="sum"><small>선택월 잔액</small><b id="sbal">0원</b></div></section><section class="datebar"><h3>📅 날짜 선택</h3><div class="dateRow"><button id="prevDay">◀</button><input id="pickDate" type="date"><button id="nextDay">▶</button></div><button class="todayBtn" id="todayBtn">오늘로 이동</button><div class="daySummary"><div><small>선택일 수입</small><b id="din">0원</b></div><div><small>선택일 지출</small><b id="dout">0원</b></div></div></section><div class="readonly" id="readonly">회원은 공동장부를 조회만 할 수 있습니다. 입력·삭제는 관리자만 가능합니다.</div><section class="panel adminOnly" id="entryPanel"><h3 id="selTitle">내역 입력</h3><div class="fields"><select id="type"><option value="in">수입</option><option value="out">지출</option></select><input id="amount" type="number" inputmode="numeric" placeholder="금액"></div><div class="fields" style="margin-top:8px"><select id="cat"><option>회비</option><option>운영비</option><option>식대</option><option>유류비</option><option>수리비</option><option>경조사</option><option>기타</option></select><input id="date" type="date"></div><input class="memo" id="memo" placeholder="내용 / 메모"><button class="save" id="save">공동장부에 저장</button></section><section class="panel"><h3 id="listTitle">선택일 내역</h3><div class="list" id="list"></div></section></main><nav class="nav"><a href="index.html"><b>🏠</b>홈</a><a href="notice.html"><b>📢</b>공지</a><a href="volume.html"><b>🚚</b>물량</a><a href="radio.html"><b>📻</b>무전</a><a href="dashboard.html"><b>📊</b>현황</a><a class="on" href="money.html"><b>💰</b>자금</a><a href="rules.html"><b>📘</b>회칙</a></nav><script>const FB={apiKey:'AIzaSyDfAUpbzd_tB6Da-6kRedtuz9G5u7Km7E0',authDomain:'daewang-radio-e1370.firebaseapp.com',databaseURL:'https://daewang-radio-e1370-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'daewang-radio-e1370',appId:'1:56169646168:web:16e5dc67b7acdfa5b1e22d'};if(!firebase.apps.length)firebase.initializeApp(FB);const auth=firebase.auth(),db=firebase.database(),ledgerRef=db.ref('fundLedger');let rows=[],isAdmin=false;const $=s=>document.querySelector(s);function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parseDate(s){return new Date(s+'T00:00:00')}function won(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}let selected=fmt(new Date());function setRole(v){isAdmin=!!v;$('#roleText').textContent=isAdmin?'관리자 편집모드':'회원 조회모드';$('#roleText').className='role'+(isAdmin?' admin':'');$('#entryPanel').classList.toggle('on',isAdmin);$('#readonly').style.display=isAdmin?'none':'block';renderList()}async function checkAdmin(user){if(!user){setRole(false);return}try{const s=await db.ref('fundAdmins/'+user.uid).once('value');setRole(s.val()===true)}catch(e){setRole(false)}}function renderSummary(){const p=selected.slice(0,7),mr=rows.filter(r=>r.date&&r.date.startsWith(p)),inc=mr.filter(r=>r.type==='in').reduce((s,r)=>s+(Number(r.amount)||0),0),out=mr.filter(r=>r.type==='out').reduce((s,r)=>s+(Number(r.amount)||0),0),dr=rows.filter(r=>r.date===selected),di=dr.filter(r=>r.type==='in').reduce((s,r)=>s+(Number(r.amount)||0),0),do_=dr.filter(r=>r.type==='out').reduce((s,r)=>s+(Number(r.amount)||0),0);$('#sin').textContent=won(inc);$('#sout').textContent=won(out);$('#sbal').textContent=won(inc-out);$('#din').textContent=won(di);$('#dout').textContent=won(do_)}function renderList(){const a=rows.filter(r=>r.date===selected).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('#pickDate').value=selected;$('#date').value=selected;$('#selTitle').textContent=selected+' 내역 입력';$('#listTitle').textContent=selected+' 공동 내역';$('#list').innerHTML=a.length?a.map(r=>`<div class="item"><div class="itemmain"><b>${r.cat||'기타'} · ${r.memo||'메모 없음'}</b><small>${r.type==='in'?'수입':'지출'}</small></div><div class="amt ${r.type}">${r.type==='in'?'+':'-'}${won(r.amount)}</div>${isAdmin?`<button class="del" data-id="${r.id}">삭제</button>`:''}</div>`).join(''):'<div class="emptymsg">등록된 내역이 없습니다.</div>';if(isAdmin)$('#list').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('이 공동장부 내역을 삭제할까요?'))return;try{await ledgerRef.child(b.dataset.id).remove()}catch(e){alert('삭제 권한이 없거나 연결에 실패했습니다.')}});renderSummary()}function moveDay(n){const d=parseDate(selected);d.setDate(d.getDate()+n);selected=fmt(d);renderList()}$('#prevDay').onclick=()=>moveDay(-1);$('#nextDay').onclick=()=>moveDay(1);$('#todayBtn').onclick=()=>{selected=fmt(new Date());renderList()};$('#pickDate').onchange=e=>{if(e.target.value){selected=e.target.value;renderList()}};$('#date').onchange=e=>{if(e.target.value){selected=e.target.value;$('#pickDate').value=selected;renderList()}};$('#save').onclick=async()=>{if(!isAdmin)return alert('관리자만 저장할 수 있습니다.');const amount=Math.max(0,Number($('#amount').value)||0),date=$('#date').value||selected;if(!amount)return alert('금액을 입력하세요.');const ref=ledgerRef.push(),item={id:ref.key,date,type:$('#type').value,cat:$('#cat').value,amount,memo:$('#memo').value.trim(),createdAt:firebase.database.ServerValue.TIMESTAMP};try{await ref.set(item);selected=date;$('#amount').value='';$('#memo').value='';renderList()}catch(e){alert('저장 권한이 없거나 인터넷 연결에 실패했습니다.')}};$('#adminBtn').onclick=()=>$('#loginBox').classList.toggle('on');$('#loginBtn').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return alert('관리자 이메일과 비밀번호를 입력하세요.');try{const c=await auth.signInWithEmailAndPassword(email,password);await checkAdmin(c.user);if(!isAdmin){await auth.signOut();alert('관리자로 등록되지 않은 계정입니다.');return}$('#loginBox').classList.remove('on')}catch(e){alert('관리자 로그인에 실패했습니다.')}};$('#logoutBtn').onclick=async()=>{await auth.signOut();$('#password').value='';setRole(false)};auth.onAuthStateChanged(checkAdmin);ledgerRef.on('value',snap=>{rows=[];snap.forEach(c=>{const v=c.val()||{};v.id=c.key;rows.push(v)});renderList()},()=>{$('#syncText').textContent='공동장부 읽기 실패';$('#dot').className='dot off'});db.ref('.info/connected').on('value',s=>{const on=s.val()===true;$('#dot').className='dot '+(on?'on':'off');$('#syncText').textContent=on?'실시간 공동장부 연결됨':'인터넷 연결 대기 중'});renderList();</script></body></html>
